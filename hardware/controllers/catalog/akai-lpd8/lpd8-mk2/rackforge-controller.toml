# Akai Professional LPD8 mk2, on Program 1, the program it starts in. Akai's
# guide gives its layout but no factory values; every value below comes
# from community sources, sourced and labelled in SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-lpd8-mk2"
name = "LPD8 mk2"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "lpd8-mk2"

# One port: "LPD8 mk2" on Windows and a Mac, "LPD8 mk2 MIDI 1" on Linux
# [community]. The first LPD8 is "LPD8" alone.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["lpd8 mk2"]

# Knobs K1-K8: CC 70-77 on the global channel, 1 by default, absolute
# [community ×3; one source says CC 1-8 on channel 10: see SOURCES.md]. K1-K4
# are the top row. The LPD8 mk2 has no keys: its knobs never play (catalog
# README). No faders: the knobs take the first row.

[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 70 }
slot = "control-1.1"
plays = false

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 71 }
slot = "control-1.2"
plays = false

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 72 }
slot = "control-1.3"
plays = false

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 73 }
slot = "control-1.4"
plays = false

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 74 }
slot = "control-1.5"
plays = false

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 75 }
slot = "control-1.6"
plays = false

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 76 }
slot = "control-1.7"
plays = false

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 77 }
slot = "control-1.8"
plays = false

# Pads 1-8: notes 36-43 on channel 10 in NOTE mode, the mode it starts in
# [community ×2; Akai's knowledge base, the mode]. Pads 1-4 are the bottom
# row and 5-8 the top one [Akai's guide, the layout]. They are drum pads: they
# play, and take the slot of the note they send.

[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 43 }
slot = "switch-1.4"

# The knobs take the catalog's roles (catalog README, "Eight knobs, no
# faders").

[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
