# Transport and function buttons, CC on channel 1 [MI native mode; MX; OV]:
# Play 41, Stop 42, Rewind 43, Fast-forward 44, Record 45, Cycle 46; Track <
# 58, Track > 59, Marker Set 60, Marker < 61, Marker > 62. The track buttons
# step the main selector, the marker arrows the second.
[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 41 }

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 42 }

[[inputs]]
id = "rewind"
name = "Rewind"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 43 }

[[inputs]]
id = "fast-forward"
name = "Fast-forward"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 44 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 45 }

[[inputs]]
id = "cycle"
name = "Cycle"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 46 }

[[inputs]]
id = "track-prev"
name = "Track <"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 58 }
slot = "step.down"

[[inputs]]
id = "track-next"
name = "Track >"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 59 }
slot = "step.up"

[[inputs]]
id = "marker-set"
name = "Marker Set"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 60 }

[[inputs]]
id = "marker-prev"
name = "Marker <"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 61 }
slot = "step-2.down"

[[inputs]]
id = "marker-next"
name = "Marker >"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 62 }
slot = "step-2.up"

# RackForge's default meanings for a row of knobs and eight faders, a
# mixer-style controller: the knobs and sliders as in the first rule, no
# master level.
[[roles]]
input = "knob-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "knob-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "knob-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "knob-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "knob-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "knob-7"
role = "synth.lfo.delay"

[[roles]]
input = "knob-8"
role = "synth.amplifier.level"

[[roles]]
input = "slider-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "slider-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "slider-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "slider-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "slider-5"
role = "synth.filter.cutoff"

[[roles]]
input = "slider-6"
role = "synth.filter.resonance"

[[roles]]
input = "slider-7"
role = "synth.lfo.rate"

[[roles]]
input = "slider-8"
role = "synth.lfo.depth"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
