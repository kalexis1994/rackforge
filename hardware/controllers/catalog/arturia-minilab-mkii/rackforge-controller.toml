# Arturia MiniLab mkII, in memory 1 ("Analog Lab"), the memory it loads at
# power-up. Arturia publishes no table of that memory's messages; every
# value below comes from community sources that agree, and is sourced and
# labelled in SOURCES.md. [UM] is the MiniLab mkII User Manual 1.1, [AR]
# Ardour's MiniLab mkII map ("works with device's factory settings, 1
# (Analog Lab)"), [BS] BespokeSynth's MiniLab mkII layouts, [JK]
# jdw-keys-backend, [SC] super-controller.
schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-minilab-mkii"
name = "MiniLab mkII"
vendor = "Arturia"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "minilab-mkii"

# One port: "Arturia MiniLab mkII" on Windows and a Mac, "Arturia MiniLab
# mkII MIDI 1" on Linux [Ableton model_name; community ×4]. The MiniLab 3
# ("Minilab3"), the MiniLab 37 and the first MiniLab never carry "minilab
# mkii".
[[devices.endpoints]]
role = "performance_input"
name_contains = ["minilab mkii"]

# Encoders: channel 1 [AR; BS; JK; SC]. Encoders 1 and 9, the two that
# click, send CC 112 and 114, relative around 64 (Arturia's "Relative 1":
# 61-63 down, 65-67 up, with a 64 after each step, which moves nothing)
# [BS PR #408; JK]; the other fourteen send absolute CC 74, 71, 76, 77, 93,
# 73, 75 and 18, 19, 16, 17, 91, 79, 72 [AR; BS; JK; SC; UM "Absolute: the
# default setting for Analog Lab"]. The top row takes the first row of
# slots, the bottom row the second. They are a keyboard's knobs: they play
# when nothing maps them.

[[inputs]]
id = "encoder-1"
name = "Encoder 1"
kind = "encoder"
group = "Encoders"
midi = { channel = 0, cc = 112 }
encoder = "relative_binary_offset"
slot = "control-1.1"

[[inputs]]
id = "encoder-2"
name = "Encoder 2"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 74 }
slot = "control-1.2"

[[inputs]]
id = "encoder-3"
name = "Encoder 3"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 71 }
slot = "control-1.3"

[[inputs]]
id = "encoder-4"
name = "Encoder 4"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 76 }
slot = "control-1.4"

[[inputs]]
id = "encoder-5"
name = "Encoder 5"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 77 }
slot = "control-1.5"

[[inputs]]
id = "encoder-6"
name = "Encoder 6"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 93 }
slot = "control-1.6"

[[inputs]]
id = "encoder-7"
name = "Encoder 7"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 73 }
slot = "control-1.7"

[[inputs]]
id = "encoder-8"
name = "Encoder 8"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 75 }
slot = "control-1.8"

[[inputs]]
id = "encoder-9"
name = "Encoder 9"
kind = "encoder"
group = "Encoders"
midi = { channel = 0, cc = 114 }
encoder = "relative_binary_offset"
slot = "control-2.1"

[[inputs]]
id = "encoder-10"
name = "Encoder 10"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 18 }
slot = "control-2.2"

[[inputs]]
id = "encoder-11"
name = "Encoder 11"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 19 }
slot = "control-2.3"

[[inputs]]
id = "encoder-12"
name = "Encoder 12"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 16 }
slot = "control-2.4"

[[inputs]]
id = "encoder-13"
name = "Encoder 13"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 17 }
slot = "control-2.5"

[[inputs]]
id = "encoder-14"
name = "Encoder 14"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 91 }
slot = "control-2.6"

[[inputs]]
id = "encoder-15"
name = "Encoder 15"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 79 }
slot = "control-2.7"

[[inputs]]
id = "encoder-16"
name = "Encoder 16"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 72 }
slot = "control-2.8"

# Clicking encoder 1 or 9 sends CC 113 or 115: 127 pressed, 0 released [AR;
# BS; JK; SC].

[[inputs]]
id = "encoder-1-click"
name = "Encoder 1 click"
kind = "button"
group = "Encoders"
midi = { channel = 0, cc = 113 }

[[inputs]]
id = "encoder-9-click"
name = "Encoder 9 click"
kind = "button"
group = "Encoders"
midi = { channel = 0, cc = 115 }

# Pads 1-8: notes 36-43 on channel 10 [UM p19, the notes; community ×4, the
# channel]. They play, and take the slot of the note they send. Pads 9-16
# (the second bank): CC 22-29 on channel 1, 127 pressed and 0 released [AR;
# BS; JK]: declared as the buttons their messages make them. No slot: the
# catalog places pads by note.

[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 43 }
slot = "switch-1.4"

[[inputs]]
id = "pad-9"
name = "Pad 9"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 22 }

[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 23 }

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 24 }

[[inputs]]
id = "pad-12"
name = "Pad 12"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 25 }

[[inputs]]
id = "pad-13"
name = "Pad 13"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 26 }

[[inputs]]
id = "pad-14"
name = "Pad 14"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 27 }

[[inputs]]
id = "pad-15"
name = "Pad 15"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 28 }

[[inputs]]
id = "pad-16"
name = "Pad 16"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 29 }

# The touch strips: pitch bend and the modulation wheel, CC 1, on channel 1
# [community ×3 and ×4]. The pitch strip takes no slot.

[[inputs]]
id = "pitch-strip"
name = "Pitch strip"
kind = "wheel"
group = "Strips"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "mod-strip"
name = "Modulation strip"
kind = "wheel"
group = "Strips"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The top row takes the catalog's roles (catalog README, "Eight knobs, no
# faders"), except encoder 1: it is relative, and roles read absolute
# controls only.

[[roles]]
input = "encoder-2"
role = "synth.filter.resonance"

[[roles]]
input = "encoder-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "encoder-4"
role = "synth.lfo.rate"

[[roles]]
input = "encoder-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "encoder-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "encoder-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "encoder-8"
role = "synth.envelope.amp.release"
