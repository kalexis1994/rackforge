# Akai Professional MPK mini Play mk3, on Favorite 1, as it leaves the
# factory. Every value below is sourced in SOURCES.md; [FAV] is Akai's own
# factory file for it, "Fav1.mpkminiplaymk3", shipped with the MPK mini Play
# mk3 Favorite Editor 1.0.3; [EG] that editor's User Guide v1.0; [UG] the MPK
# mini Play mk3 User Guide v1.0. The file has the MPK mini mk3's structure,
# and reads the same way: see SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpk-mini-play-mk3"
name = "MPK mini Play mk3"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpk-mini-play-mk3"

# Its USB port, "MPK mini Play mk3": the name Akai's editor looks for (the
# editor's own device string). "mk3" keeps the first MPK mini Play out, and
# "mpk mini 3" is never in its name.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk mini play mk3"]

# Knobs: four 270-degree knobs [UG items 17-20], in two banks [UG item 16;
# EG p5, p11]. Bank A sends CC 70-73, bank B CC 74-77, 0-127, on the
# keyboard's channel, 1 [FAV knob CCs, Min 0, Max 127; keybed & controls
# channel 0]. With the internal sounds on, bank A and B also set the
# internal filter, resonance, reverb, chorus, attack, release and EQ [UG];
# as a MIDI controller they send these CCs. The two banks fill the first
# row.
[[inputs]]
id = "knob-1"
name = "Knob 1 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 70 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 71 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 72 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 73 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 1 (bank B)"
kind = "knob"
group = "Knobs, bank B"
midi = { channel = 0, cc = 74 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 2 (bank B)"
kind = "knob"
group = "Knobs, bank B"
midi = { channel = 0, cc = 75 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 3 (bank B)"
kind = "knob"
group = "Knobs, bank B"
midi = { channel = 0, cc = 76 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 4 (bank B)"
kind = "knob"
group = "Knobs, bank B"
midi = { channel = 0, cc = 77 }
slot = "control-1.8"

# Pads: notes on channel 10 [FAV pad channel 9]. Bank A sends 36-43 and
# bank B 44-51, pad by pad [FAV; EG p5: 8 pads per bank]. A pad takes the
# slot of the note it sends, as on every keyboard in the catalog.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 43 }
slot = "switch-1.4"

[[inputs]]
id = "pad-9"
name = "Pad 9"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 44 }
slot = "switch-2.5"

[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 45 }
slot = "switch-2.6"

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 46 }
slot = "switch-2.7"

[[inputs]]
id = "pad-12"
name = "Pad 12"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 47 }
slot = "switch-2.8"

[[inputs]]
id = "pad-13"
name = "Pad 13"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 48 }
slot = "switch-2.1"

[[inputs]]
id = "pad-14"
name = "Pad 14"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 49 }
slot = "switch-2.2"

[[inputs]]
id = "pad-15"
name = "Pad 15"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 50 }
slot = "switch-2.3"

[[inputs]]
id = "pad-16"
name = "Pad 16"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 51 }
slot = "switch-2.4"

# The joystick, on the keyboard's channel: left and right bend the pitch;
# up and down both send CC 1 from 0 at the centre, a modulation wheel either
# way [FAV X axis 0 (Pitchbend), Y axis 2 (Dual CC) with CC 1 and CC 1; the
# MPK mini mk3's reading; UG item 3].
[[inputs]]
id = "joystick-x"
name = "Joystick left / right"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "joystick-y"
name = "Joystick up / down"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The sustain input [UG rear panel item 4], CC 64 on the keyboard's channel
# (the MIDI standard).
[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for eight knobs and no faders: tone on bank
# A, where the internal filter and resonance sit, the amp envelope on bank B.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
