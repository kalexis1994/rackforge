# Touch strips on the keys channel [UG p8]; the sustain input sends CC 64 by
# default [CG pedal screenshot]. Play, Record, >, Stop/Solo/Mute and the
# arrows are not declared: the guide gives them to the DAW only [UG p8].
[[inputs]]
id = "pitch-bend"
name = "Pitch strip"
kind = "wheel"
group = "Touch strips"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation strip"
kind = "wheel"
group = "Touch strips"
midi = { channel = 0, cc = 1 }

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedal"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for a keyboard with eight knobs and no
# faders: the filter, its envelope and the LFO rate, then the amp envelope.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
