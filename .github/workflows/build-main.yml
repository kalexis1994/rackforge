name: Build main artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web workspace
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Build RackForge Desktop
        shell: pwsh
        run: ./tools/build-windows-desktop.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-Windows-x86_64-${{ github.sha }}
          path: dist/windows-x86_64/RackForge.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/rackforge-android/**/*.gradle.kts
            apps/rackforge-android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - name: Build plugin-independent APK
        shell: bash
        run: bash tools/build-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-Android-arm64-${{ github.sha }}
          path: dist/android/RackForge-debug.apk
          if-no-files-found: error
          retention-days: 14

  raspberry-pi:
    name: Raspberry Pi ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Build Raspberry Pi release bundle
        shell: bash
        run: bash tools/build-raspberry-pi.sh

      - name: Upload Raspberry Pi bundle
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-RaspberryPi-arm64-${{ github.sha }}
          path: dist/raspberry-pi/RackForge-RaspberryPi-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
