# Novation SL MkIII (49SL and 61SL), in its InControl view, read on its
# InControl port. Every value below is sourced in SOURCES.md: [PR] is
# Novation's SL MkIII Programmer's Reference Guide, which tables every
# control; [BW] Bitwig's SL MkIII extension and [AB] Ableton Live 12's
# SL_MkIII script read the same numbers.
#
# The player enters the InControl view with the keyboard's InControl button
# [PR p3]. Novation documents no message that selects it, so RackForge sends
# none. The screens stay as the keyboard leaves them: drawing on them takes
# a driver.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-sl-mkiii"
name = "SL MkIII"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "sl-mkiii"

# The InControl port: "MIDIIN2 (Novation SL MkIII)" on Windows, "Novation SL
# MkIII SL MkIII InControl" on a Mac, "Novation SL MkIII SL MkIII InCo" on
# Linux [BW port names; AB the SCRIPT port second]. The keys play on the MIDI
# port, as any keyboard's do [PR p15]. The ZeRO SL MkII and SL MkII never
# carry "sl mkiii".
[[devices.endpoints]]
role = "performance_input"
name_contains = ["sl mkiii"]
name_contains_any = ["inco", "midiin2"]

# Everything on the InControl port is a control, none of it an instrument's:
# every input has `plays = false` (catalog README). All of it is on channel
# 16 [PR p3, p12].

# Rotary knobs 1-8: CC 21-28, two's complement deltas [PR p12, p14; BW
# 0x15 + i, createRelative2sComplement; AB]. The faders take the first row,
# so the knobs take the second.

[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "encoder"
group = "Knobs"
midi = { channel = 15, cc = 21 }
encoder = "relative_twos_complement"
slot = "control-2.1"
plays = false

[[inputs]]
id = "knob-2"
name = "Knob 2"
