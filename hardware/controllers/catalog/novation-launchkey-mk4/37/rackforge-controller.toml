# Novation Launchkey 37 [MK4], standalone (MIDI) mode, factory Custom Modes
# and power-on modes. Every value below is sourced in ../SOURCES.md; [PR] is
# the Programmer's Reference Guide 3.0, [UG] the Launchkey 37 user guide v3,
# [CG] Novation's Components guide for the Launchkey MK4, [FL] Novation's FL
# Studio setup article for it.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launchkey-mk4-37"
name = "Launchkey 37 [MK4]"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launchkey-37-mk4"

# The MIDI interface only: "Launchkey MK4 <size> MIDI" on Windows, "... MIDI
# Out" on a Mac; the DAW interface is "MIDIIN2 (...)", "... (Port 2)" and
# "... DAW Out" [FL; AL (the Mini's article shows the Port 2 form);
# PR p5]. The size is part of the name, so it tells the four sizes apart: the
# MK4 documents no Identity Reply. "Mini" is its own product.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launchkey", "mk4 37"]
exclude_contains = ["mini", "daw", "midiin2", "port 2", "midi 2 "]

# Encoders, factory encoder Custom Mode 1, the power-on encoder mode: CC 21-28
# on page 1 and CC 29-36 on page 2 (Encoder bank buttons), absolute 0-127, on
# the global channel [CG encoders screenshot; UG p45].
[[inputs]]
id = "encoder-1"
name = "Encoder 1"
kind = "encoder"
encoder = "absolute"
group = "Encoders"
midi = { channel = 0, cc = 21 }

[[inputs]]
id = "encoder-2"
name = "Encoder 2"
kind = "encoder"
encoder = "absolute"
group = "Encoders"
midi = { channel = 0, cc = 22 }

