# Arturia BeatStep (the first, 2014; not the BeatStep Pro), in CNTRL mode
# with its default preset. Every value below is sourced in SOURCES.md: [UM]
# is Arturia's BeatStep User's Manual 1.0.1, whose chapter 8 tables the
# default settings of every control; [AB] Ableton Live 12's BeatStep script
# names the same knobs in the same order.
schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-beatstep"
name = "BeatStep"
vendor = "Arturia"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "beatstep"

# One port, named after the product: "Arturia BeatStep" [AB __init__.py
# model_name]. The BeatStep Pro's ports all carry "Pro" or "BeatStepPro".
[[devices.endpoints]]
role = "performance_input"
name_contains = ["beatstep"]
exclude_contains = ["pro"]

# Encoders 1-16: absolute CC on the global channel, 1 by default [UM p37, p13].
# They are the sixteen small knobs, in the order Ableton programs them (its
# hardware ids 32-47 take the same numbers but the first) [AB]. The large
# Level/Rate knob sets the master level in CNTRL mode [UM p10]; Arturia does
# not say with which message, so it is not declared. The BeatStep has no
# keys: its knobs never play (catalog README). The first row takes the first
# row of slots, as on a keyboard without faders.

[[inputs]]
id = "encoder-1"
name = "Encoder 1"
kind = "knob"
group = "Encoders"
midi = { channel = 0, cc = 7 }
slot = "control-1.1"
plays = false

