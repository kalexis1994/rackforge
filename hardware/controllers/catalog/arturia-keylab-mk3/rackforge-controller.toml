# Pads, in the DAW pad bank (BANK+ until DAW): notes 0-11 on channel 10, on
# the DAW port [BW RgbNoteButton(i); AB channels=9]. They launch clips, never
# notes an instrument should hear. No slot: the catalog places pads by the
# notes 36-51, and these send 0-11. In banks A-D the pads send notes 36 and
# up [UM p20], which the package does not describe.

