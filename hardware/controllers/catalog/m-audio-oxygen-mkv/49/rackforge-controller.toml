# < and >, which scroll track banks in DAW mode [UG p13]: Bank < 110 and
# Bank > 111 [AB, inherited]; they step the main selector. Transport: Loop
# 114, Stop 117, Play 118, Record 119 [UG p14 names them; AB, inherited].
[[inputs]]
id = "bank-left"
name = "<"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 110 }
slot = "step.down"

[[inputs]]
id = "bank-right"
name = ">"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 111 }
slot = "step.up"

[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 114 }

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

# RackForge's default meanings for eight knobs and nine faders.
[[roles]]
input = "knob-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "knob-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "knob-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "knob-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "knob-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "knob-7"
role = "synth.lfo.delay"

[[roles]]
input = "knob-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "fader-9"
role = "rackforge.master.level"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
