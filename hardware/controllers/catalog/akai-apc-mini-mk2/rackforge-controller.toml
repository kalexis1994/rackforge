[[inputs]]
id = "fader-9"
name = "Master fader"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 56 }
plays = false

# The clip grid, 8 by 8: notes 0-63 on channel 1 in Session mode, numbered
