# The joystick, on the keyboard's channel: left and right bend the pitch;
# up and down apply a modulation wheel effect [QS item 8], CC 1 [BW keys
# input "b001??"; BW's program sets the Y axis to Dual CC with CC 1 both
# ways, FAQ "Modulation 2 ... the center axis is 0"].
[[inputs]]
id = "joystick-x"
name = "Joystick left / right"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "joystick-y"
name = "Joystick up / down"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The sustain pedal input, CC 64 on the keyboard's channel [QS item 2; BW
# keys input "b040??"].
[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for eight knobs and no faders: tone on the top
# row, the amp envelope on the bottom one.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
