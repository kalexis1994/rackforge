# Wheels on the keys channel [UG p8]; the sustain pedal sends CC 64 by
# default [CG].
[[inputs]]
id = "pitch-bend"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedal"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for a keyboard with eight knobs and no
# faders: the filter, its envelope and the LFO rate, then the amp envelope.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"

[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
