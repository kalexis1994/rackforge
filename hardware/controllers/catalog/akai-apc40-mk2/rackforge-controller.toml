# Akai Professional APC40 mkII, in Generic Mode, the mode it starts in.
# Every value below is sourced in SOURCES.md; [CP] is Akai's APC40 Mk2
# Communications Protocol v1.2, [AB] Ableton Live 12's APC40_MkII script
# (over _APC), [BW] Bitwig's APC40 mkII extension. [CP] states the modes and
# which controls send on which channel; [AB] gives every number, and [CP]'s
# tables agree with it.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-apc40-mk2"
name = "APC40 mkII"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "apc40-mk2"

# Its one port: "APC40 mkII" on Windows and a Mac, "APC40 mkII MIDI 1" on
# Linux [BW]; "Akai APC40 MkII" as well [AB model_name]. "mkii" keeps the
# first APC40 out, which sends other messages.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["apc40 mkii"]

# Track faders 1-8: CC 7, each on its track's channel, 1-8 [AB make_slider
# (track, 7); CP "the 4-bit <chan> value will be used for the track"]. They
# take the first row. The master fader, CC 14, keeps the master level; the
# crossfader is CC 15 [AB].
[[inputs]]
id = "fader-1"
name = "Track 1 fader"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 7 }
slot = "control-1.1"

[[inputs]]
id = "fader-2"
name = "Track 2 fader"
kind = "fader"
group = "Faders"
midi = { channel = 1, cc = 7 }
slot = "control-1.2"

