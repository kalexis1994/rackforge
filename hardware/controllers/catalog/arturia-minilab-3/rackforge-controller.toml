# Arturia MiniLab 3, in its ARTURIA program, or in a User program that keeps
# the default template: the two send the same numbers [CH]. Every value below
# is sourced in SOURCES.md; [UM] is the MiniLab 3 User Manual 1.0.5, [MCC]
# the MIDI Control Center for MiniLab 3 manual 1.14.1, [CH] Arturia's MIDI
# implementation chart for the MiniLab 3 (its FAQ, "General Questions"),
# [BW] Bitwig's MiniLab 3 extension, [AB] Ableton Live 12's MiniLab_3 script.
schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-minilab-3"
name = "MiniLab 3"
vendor = "Arturia"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "minilab-3"

# Its MIDI port: "Minilab3" on Windows (or "Minilab3 MIDI" with the MIDI
# Control Center installed), "Minilab3 MIDI" on a Mac, "Minilab3 Minilab3
# MIDI" on Linux [BW port names; CH "Minilab3 MIDI"]. Its other ports -- DIN
# Thru, MCU/HUI, ALV [UM 5.2; CH], or "MIDIIN2-4 (Minilab3)" on Windows --
# carry no playing, and the MiniLab 37 calls itself "Minilab37" [BW].
[[devices.endpoints]]
role = "performance_input"
name_contains = ["minilab3"]
exclude_contains = ["minilab37", "thru", "mcu", "hui", "alv", "midiin"]

# Faders 1-4: CC 82, 83, 85, 17 on the keyboard's channel, 1 [UM 5.4.3; CH
# "Arturia" and "Users" columns]. They take the first row, as on every
# keyboard with faders.
[[inputs]]
id = "fader-1"
name = "Fader 1"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 82 }
slot = "control-1.1"

[[inputs]]
id = "fader-2"
name = "Fader 2"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 83 }
slot = "control-1.2"

[[inputs]]
id = "fader-3"
name = "Fader 3"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 85 }
slot = "control-1.3"

[[inputs]]
id = "fader-4"
name = "Fader 4"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 17 }
slot = "control-1.4"

# Knobs 1-8: CC 74, 71, 76, 77, 93, 18, 19, 16 on the keyboard's channel [UM
# 5.4.1-5.4.2; CH]. They turn endlessly but send absolute values: a knob
# sends a CC between its Min and Max, and has no relative setting [MCC 3.6].
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 74 }
slot = "control-2.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 71 }
slot = "control-2.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 76 }
slot = "control-2.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 77 }
slot = "control-2.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 93 }
slot = "control-2.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 18 }
slot = "control-2.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 19 }
slot = "control-2.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 16 }
slot = "control-2.8"

# Pads: notes on channel 10, bank A 36-43 and bank B 44-51, pad by pad [UM
# 4.4, 5.4.4; AB Pad_Bank_A 36-43 and Pad_Bank_B 44-51 on channel 10; BW
# the same]. A pad takes the slot of the note it sends, as on every keyboard
# in the catalog.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 43 }
slot = "switch-1.4"

[[inputs]]
id = "pad-9"
name = "Pad 9"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 44 }
slot = "switch-2.5"

[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 45 }
slot = "switch-2.6"

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 46 }
slot = "switch-2.7"

[[inputs]]
id = "pad-12"
name = "Pad 12"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 47 }
slot = "switch-2.8"

[[inputs]]
id = "pad-13"
name = "Pad 13"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 48 }
slot = "switch-2.1"

[[inputs]]
id = "pad-14"
name = "Pad 14"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 49 }
slot = "switch-2.2"

[[inputs]]
id = "pad-15"
name = "Pad 15"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 50 }
slot = "switch-2.3"

[[inputs]]
id = "pad-16"
name = "Pad 16"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 51 }
slot = "switch-2.4"

# The pads' transport functions (Shift + Pad 4-8, or the Transport pad
# bank): Loop, Stop, Play, Record and Tap Tempo send CC 105-109 on channel 1,
# 127 on press and 0 on release, in every program [UM 4.1, 4.4.1; CH "Pad
# 4" 105 to "Pad 8" 109; AB Loop 105, Stop 106, Play 107, Record 108, Tap
# Tempo 109; BW the same].
[[inputs]]
id = "loop"
name = "Loop (Shift + Pad 4)"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 105 }

[[inputs]]
id = "stop"
name = "Stop (Shift + Pad 5)"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 106 }

[[inputs]]
id = "play"
name = "Play (Shift + Pad 6)"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 107 }

[[inputs]]
id = "record"
name = "Record (Shift + Pad 7)"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 108 }

[[inputs]]
id = "tap-tempo"
name = "Tap Tempo (Shift + Pad 8)"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 109 }

# The touch strips, on the keyboard's channel: pitch bend on the left, CC 1
# on the right [UM 4.3].
[[inputs]]
id = "pitch-bend"
name = "Pitch strip"
kind = "wheel"
group = "Touch strips"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation strip"
kind = "wheel"
group = "Touch strips"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The pedal input, as a sustain pedal: CC 64 on the keyboard's channel [MCC
# 4.4, 4.4.1].
[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for eight knobs and four faders: the amp
# envelope on the faders, tone on knobs 1-4, modulation and level on 5-8.
[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.lfo.depth"

[[roles]]
input = "knob-6"
role = "synth.filter.lfo.amount"

[[roles]]
input = "knob-7"
role = "synth.filter.key_tracking"

[[roles]]
input = "knob-8"
role = "synth.amplifier.level"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
