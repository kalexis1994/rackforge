[package]
name = "rackforge-core"
description = "Headless RackForge host runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
rackforge-audio-api = { path = "../rackforge-audio-api" }
rackforge-plugin-api = { path = "../rackforge-plugin-api", features = ["package-validation"] }
rackforge-plugin-runtime = { path = "../rackforge-plugin-runtime" }
rackforge-control-api = { path = "../rackforge-control-api" }
rackforge-midi-api = { path = "../rackforge-midi-api" }
rackforge-performance-api = { path = "../rackforge-performance-api" }
rackforge-session-api = { path = "../rackforge-session-api" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

# Native plugin packages are dynamic libraries, which only exist off the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.10"
libc = "0.2"
midir = "0.11"

[dev-dependencies]
wat = "1.245"
