[package]
name = "rackforge-plugin-runtime"
description = "Host runtime for portable RackForge plugins: wasm-v1 components and their native builds"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true

# The browser backend uses the engine already present in the page, so the
# compiler is only a dependency of the native hosts.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime.workspace = true
# Binaryen, run over every component before Cranelift compiles it (see
# src/optimize.rs). Without its DWARF support: components carry none the
# host reads.
wasm-opt = { version = "0.116.1", default-features = false }
sha2.workspace = true
# Native builds of portable processors: the SDK defines their table, and
# libloading opens the library that carries it.
rackforge-plugin-sdk = { path = "../rackforge-plugin-sdk" }
libloading.workspace = true

[dev-dependencies]
wat = "1.245"
