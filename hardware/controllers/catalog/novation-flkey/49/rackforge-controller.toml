# Novation FLkey 49 (the first FLkey generation), standalone use outside FL
# Studio. Every value below is sourced in ../SOURCES.md; [UG] is the FLkey 49
# user guide, [CG] Novation's FLkey Components guide.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-flkey-49"
name = "FLkey 49"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "flkey-49"

# The MIDI interface only: "FLkey 49 FLkey MIDI Out" in Novation's screenshot;
# the DAW interface is "... DAW Out", named MIDIIN2 on Windows [UG]. The
# FLkey 2 is "FLkey MK2 ..." and never matches.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["flkey 49"]
exclude_contains = ["mk2", "daw", "midiin2", "port 2", "midi 2 "]

# Pots, the default pot Custom Mode, the only pot mode outside FL Studio:
# CC 21-28 on the global (keys) channel, channel 1 by default [CG pot editor
# screenshot; UG p15, p17, p44].
[[inputs]]
id = "pot-1"
name = "Pot 1"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 21 }
slot = "control-2.1"

[[inputs]]
id = "pot-2"
name = "Pot 2"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 22 }
slot = "control-2.2"

[[inputs]]
id = "pot-3"
name = "Pot 3"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 23 }
slot = "control-2.3"

[[inputs]]
id = "pot-4"
name = "Pot 4"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 24 }
slot = "control-2.4"

[[inputs]]
id = "pot-5"
name = "Pot 5"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 25 }
slot = "control-2.5"

[[inputs]]
id = "pot-6"
name = "Pot 6"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 26 }
slot = "control-2.6"

[[inputs]]
id = "pot-7"
name = "Pot 7"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 27 }
slot = "control-2.7"

[[inputs]]
id = "pot-8"
name = "Pot 8"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 28 }
slot = "control-2.8"

# Faders and fader buttons, the default fader Custom Mode: faders CC 71-79,
# buttons CC 11-19, momentary, on the global channel [CG "Faders" screenshot of
# a new Custom Mode; UG p29, p33-34].
[[inputs]]
id = "fader-1"
name = "Fader 1"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 71 }
slot = "control-1.1"

[[inputs]]
id = "fader-2"
name = "Fader 2"
