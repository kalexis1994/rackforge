# SIMD128 for every wasm build in the workspace. Both hosts execute it:
# wasmtime (desktop, Raspberry Pi) enables the SIMD proposal by default and
# cranelift lowers it to SSE/NEON, and every browser has shipped it as
# baseline since 2021. The Concert Grand's hot loop is thousands of
# independent 2-D phasor rotations per sample; letting LLVM vectorize them
# is the difference between a Pi that keeps up and one that does not.
# And an 8 MiB shadow stack (the default is 1 MiB). The Concert Grand's
# processor is built by value before it is written into its static, and a
# voice pool of thirty-two strings is 400 KiB of that value: at thirteen
# voices it fit the default stack with nothing to spare, and the twenty
# voices a pedalled nocturne needs did not. The stack lives in linear
# memory, so this is eight megabytes of memory and no more.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=-zstack-size=8388608"]

# The browser host is the same kind of program with the same need. It holds a
# session, a plugin catalog and every parameter schema it reads out of a
# package -- the Concert Grand alone declares nearly two hundred parameters --
# and it passes them between frames by value. A wasm shadow stack does not
# trap when it runs out: it writes on past its end, into whatever linear
# memory is below, and the corruption surfaces somewhere else entirely. It
# surfaced as node dying with SIGSEGV in the middle of installing a package
# (2026-09-08), after every capability check before it had passed, and it
# moved as the demo gained plugins. Eight megabytes here as well.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
