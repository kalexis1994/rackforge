schema_version = 1
id = "org.rackforge.gain"
name = "RackForge Gain"
vendor = "RackForge"
version = "0.1.0"
kind = "effect"
state_version = 1
capabilities = [
    "audio_input",
    "audio_output",
    "presets",
    "state",
    "sample_accurate_automation",
]

[audio]
input_buses = [{ id = "main", name = "Input", channels = 2, layout = "stereo" }]
output_buses = [{ id = "main", name = "Output", channels = 2, layout = "stereo" }]

[api]
major = 1
minor = 9

[binaries]
linux-aarch64 = "lib/librackforge_gain.so"
linux-x86_64 = "lib/librackforge_gain.so"
windows-x86_64 = "lib/rackforge_gain.dll"
