[package]
name = "rackforge-controller-arturia-keylab-essential-mk3"
version = "0.1.1"
edition = "2024"
description = "RackForge controller driver for the Arturia KeyLab Essential mk3"
license = "GPL-2.0-or-later"

[[bin]]
name = "rackforge-arturia-keylab-essential-mk3-driver"
path = "src/main.rs"

[dependencies]
rackforge-ui = { path = "../runtime/rackforge-ui" }
rackforge-control-api = { path = "../runtime/rackforge-control-api" }
rackforge-controller-api = { path = "../runtime/rackforge-controller-api" }
rackforge-controller-package = { path = "../runtime/rackforge-controller-package" }
rackforge-session-api = { path = "../runtime/rackforge-session-api" }
rackforge-surface-runtime = { path = "../runtime/rackforge-surface-runtime" }
midir = "0.11.0"
serde_json = "1"
