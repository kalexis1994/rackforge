# Arturia KeyLab mk3 (49, 61 and 88), in its DAW mode, read on its DAW port.
# Every value below is sourced in SOURCES.md; [BW] is Bitwig's KeyLab mk3
# extension, [AB] Ableton Live 12's KeyLab_mk3 script, [BG] Bitwig's KeyLab
# mk3 setup guide, [UM] the KeyLab mk3 User Manual. [BW] and [AB] are
# official software and read the same controls, value for value, except
# where a comment says otherwise.
#
# The player enters DAW mode on the keyboard: at power-up, or PROG, then DAW
# [UM p51; BG p4].
# No official script selects it by message, so RackForge does not either;
# it sends the DAW connection message both scripts send.
schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-keylab-mk3"
name = "KeyLab mk3"
vendor = "Arturia"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "keylab-mk3"

# The controls speak on the DAW port: "MIDIIN2 (KeyLab 49 mk3)" /
# "MIDIOUT2 (KeyLab 49 mk3)" on Windows, "KeyLab 49 mk3 DAW" on a Mac,
# "KeyLab 49 mk3 KeyLab 49 mk3 DAW" on Linux [BG p4; BW port names]. The keys,
# wheels and pedals stay on the MIDI port and play as any keyboard does. Every
# size has the same panel [UM p7: 9 encoders, 9 faders], so one package
# reads the three. The KeyLab Essential mk3 ("KL Essential 61 mk3") and the
# KeyLab mkII ("KeyLab mkII 61") never carry "keylab" and "mk3" together
# without "essential".
[[devices.endpoints]]
role = "performance_input"
name_contains = ["keylab", "mk3"]
name_contains_any = ["midiin2", "daw"]
exclude_contains = ["essential"]

# Where the connection message goes: the same port, as an output.
[[devices.endpoints]]
role = "setup_output"
name_contains = ["keylab", "mk3"]
name_contains_any = ["midiout2", "daw"]
exclude_contains = ["essential"]

# On connect, RackForge sends the DAW connection message Bitwig and Ableton
# send when they take the keyboard [BW DAW_CONNECTION; AB CONNECTION_MESSAGE]:
# F0 00 20 6B 7F 42 00 02 05 01 F7.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 20 6B 7F 42 00 02 05 01 F7"
to = "setup_output"

# Everything on the DAW port is a DAW protocol's control, none of it an
# instrument's: every input has `plays = false` (catalog README).

# Encoders 1-9: CC 91, 92, 94, 95, 96, 97, 102, 103, 104, channel 1, relative,
# 64 standing still [BW ENCODER_CC, binary offset; AB encoders]. Encoders 1-8
# take the second row; the ninth no slot.

[[inputs]]
id = "encoder-1"
name = "Encoder 1"
kind = "encoder"
group = "Encoders"
midi = { channel = 0, cc = 91 }
encoder = "relative_binary_offset"
slot = "control-2.1"
plays = false

