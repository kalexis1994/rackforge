schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-keylab-essential-mk3"
name = "Arturia KeyLab Essential mk3"
vendor = "Arturia"
version = "0.6.0"
controller_api = "^1.0"
# The identity the controls had under schema 1: what a player learnt on them
# stays linked across the move.
source_id = "controller.arturia.keylab-essential-mk3.midi"

[runtime]
kind = "process-v1"

[runtime.entrypoints]
linux-aarch64 = "bin/linux-aarch64/rackforge-arturia-keylab-essential-mk3-driver"
linux-x86-64 = "bin/linux-x86-64/rackforge-arturia-keylab-essential-mk3-driver"
windows-x86-64 = "bin/windows-x86-64/rackforge-arturia-keylab-essential-mk3-driver.exe"

[permissions]
midi_input = true
midi_output = true
sysex = true
usb_metadata = true
raw_usb = false
firmware_write = false
filesystem = false
network = false

# Inputs, as read off the hardware with the `midi_map` example (2026-09-24):
# everything below arrives on the main MIDI port. Channels are zero-based.
#
# Not listed, because the driver owns them on the controller plane: the four
# OLED buttons (CC 44-47) and the main encoder (CC 116 turn, 117 press) drive
# LITTLE; Stop, Play, Record, TAP and Loop (CC 20-24) drive the transport.
# Not listed, because they send nothing a map can use: MIDI Ch, Transp -/+,
# Oct -/+, Arp, Chord, Scale and Hold act inside the keyboard, and Prog sends
# a SysEx program change.
#
# The ids are the ones the controls have always had -- a player's mappings
# refer to them -- so the nine knobs keep `encoder-N` although they turn
# between end stops and send absolute values.
[[inputs]]
id = "encoder-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { cc = 96, channel = 0 }
slot = "control-2.1"

[[inputs]]
id = "encoder-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { cc = 97, channel = 0 }
slot = "control-2.2"

[[inputs]]
id = "encoder-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { cc = 98, channel = 0 }
slot = "control-2.3"

[[inputs]]
id = "encoder-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { cc = 99, channel = 0 }
slot = "control-2.4"

[[inputs]]
id = "encoder-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { cc = 100, channel = 0 }
slot = "control-2.5"

[[inputs]]
id = "encoder-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { cc = 101, channel = 0 }
slot = "control-2.6"

[[inputs]]
id = "encoder-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { cc = 102, channel = 0 }
slot = "control-2.7"

[[inputs]]
id = "encoder-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { cc = 103, channel = 0 }
slot = "control-2.8"

# Knob 9 is declared an encoder, reading absolute values, only so its pan
# role can follow it relatively (see the role below): a package reads only
# an encoder relatively.
[[inputs]]
id = "encoder-9"
name = "Knob 9"
kind = "encoder"
group = "Knobs"
midi = { cc = 104, channel = 0 }

[[inputs]]
id = "fader-1"
name = "Fader 1"
kind = "fader"
group = "Faders"
midi = { cc = 105, channel = 0 }
slot = "control-1.1"

[[inputs]]
id = "fader-2"
name = "Fader 2"
kind = "fader"
group = "Faders"
midi = { cc = 106, channel = 0 }
slot = "control-1.2"

[[inputs]]
id = "fader-3"
name = "Fader 3"
kind = "fader"
group = "Faders"
midi = { cc = 107, channel = 0 }
slot = "control-1.3"

[[inputs]]
id = "fader-4"
name = "Fader 4"
kind = "fader"
group = "Faders"
midi = { cc = 108, channel = 0 }
slot = "control-1.4"

[[inputs]]
id = "fader-5"
name = "Fader 5"
kind = "fader"
group = "Faders"
midi = { cc = 109, channel = 0 }
slot = "control-1.5"

[[inputs]]
id = "fader-6"
name = "Fader 6"
kind = "fader"
group = "Faders"
midi = { cc = 110, channel = 0 }
slot = "control-1.6"

[[inputs]]
id = "fader-7"
name = "Fader 7"
kind = "fader"
group = "Faders"
midi = { cc = 111, channel = 0 }
slot = "control-1.7"

[[inputs]]
id = "fader-8"
name = "Fader 8"
kind = "fader"
group = "Faders"
midi = { cc = 112, channel = 0 }
slot = "control-1.8"

[[inputs]]
id = "fader-9"
name = "Fader 9"
kind = "fader"
group = "Faders"
midi = { cc = 113, channel = 0 }

# The pads play notes on MIDI channel 11. Bank 1 starts its top row at 40
# and its bottom row at 36; bank 2 the same, eight notes up. A pad mapped as
# a button is taken by its mapping and does not also play its note.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads bank 1"
midi = { note = 40, channel = 10 }
slot = "switch-1.1"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads bank 1"
midi = { note = 41, channel = 10 }
slot = "switch-1.2"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads bank 1"
