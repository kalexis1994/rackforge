<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RackForge Concert Grand</title>
    <style>
      /*
       * The instrument's own identity, taken from the photograph in
       * branding/: black lacquer, the harp's gold, and the thin deco rules of
       * the RF-GP mark. Nothing here is a host colour — RackForge keeps its
       * own chrome, and this surface stays inside its frame.
       */
      :root {
        color-scheme: dark;
        --lacquer: #000506;
        --case: #0b0d0f;
        --rule: #2a2118;
        --gold: #f3bc7c;
        --gold-dim: #8a6a44;
        --ink: #f2e7d8;
        --muted: #8c8073;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 0 32px;
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: var(--lacquer);
      }
      .plate {
        position: relative;
        aspect-ratio: 4 / 1;
        background: #000 center/cover no-repeat;
        border-bottom: 1px solid var(--rule);
      }
      .plate::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, var(--lacquer) 2%, transparent 42%),
          linear-gradient(0deg, rgba(0, 5, 6, 0.85), transparent 55%);
      }
      .plate h1 {
        position: absolute;
        left: 22px;
        bottom: 14px;
        z-index: 1;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .plate p {
        position: absolute;
        left: 22px;
        bottom: -2px;
        z-index: 1;
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      main { max-width: 560px; padding: 24px 22px 0; }
      .voicing {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 26px;
      }
      .voicing button {
        flex: 1 1 auto;
        padding: 7px 0;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold-dim);
        background: var(--case);
        border: 1px solid var(--rule);
        border-radius: 2px;
        cursor: pointer;
      }
      .voicing button:hover { color: var(--gold); border-color: var(--gold-dim); }
      .voicing button[aria-pressed="true"] {
        color: var(--lacquer);
        background: var(--gold);
        border-color: var(--gold);
      }
      section { margin-bottom: 26px; }
      section > h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold-dim);
      }
      section > h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--rule), transparent);
      }
      .control { display: grid; gap: 5px; margin-bottom: 15px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; }
      .name { font-size: 13px; letter-spacing: 0.02em; }
      .value {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--gold);
      }
      /* The fader: a hairline track that fills with gold behind the handle. */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 18px;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--gold) 0 var(--fill, 50%),
          #1a1512 var(--fill, 50%) 100%
        );
      }
      input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: #1a1512; }
      input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--gold); }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid var(--lacquer);
        box-shadow: 0 0 0 1px var(--gold-dim);
      }
      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid var(--lacquer);
        box-shadow: 0 0 0 1px var(--gold-dim);
      }
      details { border-top: 1px solid var(--rule); padding-top: 14px; }
      summary {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold-dim);
        cursor: pointer;
      }
      summary:hover { color: var(--gold); }
      details > div { padding-top: 16px; }
      .tools { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
      .tools button {
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
        background: transparent;
        border: 1px solid var(--gold-dim);
        border-radius: 2px;
        cursor: pointer;
      }
      .tools button:hover { background: rgba(243, 188, 124, 0.08); }
      textarea {
        display: none;
        width: 100%;
        height: 120px;
        margin-top: 12px;
        padding: 10px;
        color: var(--ink);
        background: var(--case);
        border: 1px solid var(--rule);
        border-radius: 2px;
        font: 12px/1.45 ui-monospace, Consolas, monospace;
      }
      .state {
        margin: 16px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="plate" id="plate">
      <h1>Concert Grand</h1>
      <p>Physically modelled · no samples</p>
    </div>
    <main>
      <div class="voicing" id="voicing"></div>
      <div id="controls"></div>
      <p class="state" id="state">Connecting to RackForge…</p>
    </main>

    <script type="module">
      /*
       * A minimal RackForge plugin surface.
       *
       * It owns its own interface and asks the host for everything else: the
       * parameter schema, the current values, and permission to change one.
       * No path, no plugin id and no Core command is ever sent from here — the
       * host derives all of that from which surface is talking to it.
       */
      const PROTOCOL = "rackforge.plugin.web@1";
      const pending = new Map();
      let nextRequest = 1;

      const controls = document.getElementById("controls");
      const voicing = document.getElementById("voicing");
      const state = document.getElementById("state");

      // The banner ships in the package beside this surface, so the plate is
      // the instrument itself rather than a painted rectangle.
      document.getElementById("plate").style.backgroundImage =
        "url(../branding/banner.png)";

      function call(method, params = {}) {
        const requestId = `concert-grand-${nextRequest++}`;
        return new Promise((resolve, reject) => {
          pending.set(requestId, { resolve, reject });
          parent.postMessage(
            { protocol: PROTOCOL, kind: "request", request_id: requestId, method, params },
            "*",
          );
        });
      }

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (!message || message.protocol !== PROTOCOL) return;
        if (message.kind === "context") {
          state.textContent = `Connected · ${message.surface ?? "play"} surface`;
          void load();
          return;
        }
        if (message.kind !== "response") return;
        const waiting = pending.get(message.request_id);
        if (!waiting) return;
        pending.delete(message.request_id);
        if (message.ok) {
          waiting.resolve(message.result);
        } else {
          waiting.reject(new Error(message.error ?? "RackForge refused the request"));
        }
      });

      /** One fader, wired to the host and painted to its own fill. */
      function fader(parameter, value) {
        const kind = parameter.kind;
        const wrapper = document.createElement("div");
        wrapper.className = "control";
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = parameter.name;
        const reading = document.createElement("span");
        reading.className = "value";
        row.append(name, reading);

        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = String(kind.minimum);
        slider.max = String(kind.maximum);
        slider.step = String(kind.step ?? 0.01);
        slider.value = String(value ?? kind.default);
        slider.setAttribute("aria-label", parameter.name);

        const show = () => {
          const span = kind.maximum - kind.minimum || 1;
          const fill = ((Number(slider.value) - kind.minimum) / span) * 100;
          slider.style.setProperty("--fill", `${fill}%`);
          reading.textContent = Number(slider.value).toFixed(2);
        };
        show();
        slider.addEventListener("input", () => {
          show();
          void call("plugin.set_parameter", {
            parameter_index: parameter.index,
            value: Number(slider.value),
          }).catch((error) => {
            state.textContent = error.message;
          });
        });

        wrapper.append(row, slider);
        return wrapper;
      }

      /** Groups the faders the way the plugin declares its pages. */
      function draw(schema, values) {
        const current = new Map(values.map((value) => [value.index, value.value]));
        const pages = [...(schema.pages ?? [])].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const floats = schema.parameters.filter((p) => p.kind.type === "float");
        controls.replaceChildren();

        for (const page of pages.length ? pages : [{ id: null, name: "Voice" }]) {
          const mine = floats.filter((p) => (p.page ?? null) === page.id);
          if (!mine.length) continue;
          mine.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
          const body = document.createElement("div");
          for (const parameter of mine) {
            body.append(fader(parameter, current.get(parameter.index)));
          }
          // The lab page is a workbench, not part of the instrument's face:
          // it stays folded until someone goes looking for it.
          if (page.id === "lab") {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = `${page.name} · ${mine.length} controls`;
            // Exporting the settings is a development tool: it lives with the
            // workbench controls, not on the instrument's face.
            body.append(exportRow());
            details.append(summary, body);
            controls.append(details);
          } else {
            const section = document.createElement("section");
            const heading = document.createElement("h2");
            heading.textContent = page.name;
            section.append(heading, body);
            controls.append(section);
          }
        }
      }

      /**
       * The packaged voicings, as buttons rather than a hidden menu. The
       * catalog comes from the plugin's own package — the host serves it
       * beside this surface — and switching one goes through
       * `plugin.select_sound`, the only route the host offers for it.
       */
      async function drawPresets() {
        let presets = [];
        try {
          const response = await fetch("../metadata/presets.json");
          presets = (await response.json()).presets ?? [];
        } catch {
          return;
        }
        presets.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        voicing.replaceChildren();
        for (const preset of presets) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = preset.name ?? preset.id;
          button.title = preset.description ?? "";
          button.setAttribute("aria-pressed", "false");
          button.addEventListener("click", async () => {
            try {
              await call("plugin.select_sound", { sound_id: preset.id });
              for (const other of voicing.children) {
                other.setAttribute("aria-pressed", String(other === button));
              }
              state.textContent = `Voicing · ${button.textContent}`;
              await load(false);
            } catch (error) {
              state.textContent = error.message;
            }
          });
          voicing.append(button);
        }
      }

      async function load(withPresets = true) {
        try {
          const parameters = await call("plugin.parameters");
          draw(parameters.schema, parameters.values ?? []);
          if (withPresets) await drawPresets();
        } catch (error) {
          state.textContent = error.message;
        }
      }

      /** The workbench export: every value as JSON, for tuning by ear. */
      function exportRow() {
        const tools = document.createElement("div");
        tools.className = "tools";
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Copiar JSON";
        const dump = document.createElement("textarea");
        dump.readOnly = true;
        tools.append(button);
        const wrapper = document.createElement("div");
        wrapper.append(tools, dump);
        button.addEventListener("click", () => void copySettings(dump));
        return wrapper;
      }

      async function copySettings(dump) {
        try {
          const parameters = await call("plugin.parameters");
          const values = new Map((parameters.values ?? []).map((v) => [v.index, v.value]));
          const out = {};
          for (const p of parameters.schema.parameters) {
            out[p.id ?? p.name] = Number((values.get(p.index) ?? p.kind.default).toFixed(3));
          }
          const text = JSON.stringify(out, null, 1);
          dump.style.display = "block";
          dump.value = text;
          dump.select();
          try {
            await navigator.clipboard.writeText(text);
            state.textContent = "Copiado al portapapeles ✓";
          } catch {
            document.execCommand("copy");
            state.textContent = "Seleccionado — Ctrl+C para copiar";
          }
        } catch (error) {
          state.textContent = error.message;
        }
      }

      parent.postMessage({ protocol: PROTOCOL, kind: "ready" }, "*");
    </script>
  </body>
</html>
