name: Publish the browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the WebAssembly targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rackforge-browser-demo
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The interface's package manager is pinned in web/package.json, and the
      # repository has no manifest at its root for an action to read one from.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the host and the instrument it plays
        run: ./tools/build-web-demo.sh

      # Every capability the host claims in crates/rackforge-host-capabilities
      # is exercised here, so the parity table cannot promise what the host
      # does not do.
      - name: Check the host against what it claims
        run: |
          storage="$(mktemp -d)"
          cp -r web/public/demo/rackforge/. "$storage"
          python3 tools/make-probe-package.py \
            web/public/demo/rackforge/plugins/concert-grand "$RUNNER_TEMP/probe.rfplugin"
          node tools/check-browser-host.mjs \
            web/public/demo/rackforge-browser.wasm "$storage" "$RUNNER_TEMP/probe.rfplugin"

      - name: Install the interface dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build the site
        run: pnpm build
        working-directory: web
        env:
          VITE_RACKFORGE_BROWSER_HOST: "1"

          # Project pages are served from /<repository>/.
          RACKFORGE_WEB_BASE: /${{ github.event.repository.name }}/

      # tools/build-live-page.py has existed since the page was written, but
      # nothing ran it, so the self-contained piano was never published and
      # its URL 404'd. It embeds the host, the worklet and the package, so it
      # has to run after both the demo assets and the site build.
      - name: Build the self-contained Concert Grand page
        run: python3 tools/build-live-page.py web/dist/concert-grand-live.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
