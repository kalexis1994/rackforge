# Right 96, Left 97, Shift 98, Tap Tempo 99, Nudge - 100, Nudge + 101,
# Session Record 102, Bank 103. Left and right step the main selector, down
# and up the second; Metronome takes its switch. Shift is the modifier
# Ableton's script holds [AB PrioritizedResource, the shifted matrix]: here,
# the Fn button. Play and Stop take the transport.
[[inputs]]
id = "pan"
name = "Pan"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 87 }

[[inputs]]
id = "sends"
name = "Sends"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 88 }

[[inputs]]
id = "user"
name = "User"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 89 }

[[inputs]]
id = "metronome"
name = "Metronome"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 90 }
slot = "switch-3.3"

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 91 }

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 92 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 93 }

[[inputs]]
id = "up"
name = "Up"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 94 }
slot = "step-2.up"

[[inputs]]
id = "down"
name = "Down"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 95 }
slot = "step-2.down"

[[inputs]]
id = "right"
name = "Right"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 96 }
slot = "step.up"

[[inputs]]
id = "left"
name = "Left"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 97 }
slot = "step.down"

[[inputs]]
id = "shift"
name = "Shift"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 98 }
modifier = true

[[inputs]]
id = "tap-tempo"
name = "Tap Tempo"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 99 }

[[inputs]]
id = "nudge-down"
name = "Nudge -"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 100 }

[[inputs]]
id = "nudge-up"
name = "Nudge +"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 101 }

[[inputs]]
id = "session-record"
name = "Session Record"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 102 }

[[inputs]]
id = "bank"
name = "Bank"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 103 }

# The foot pedal input: CC 64, channel 1 [AB make_pedal_button(64), a CC].
[[inputs]]
id = "pedal"
name = "Foot pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for rows of knobs and eight faders: the
# faders and the Track Control row as in the first rule; the master fader,
# the master level.
[[roles]]
input = "track-knob-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "track-knob-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "track-knob-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "track-knob-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "track-knob-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "track-knob-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "track-knob-7"
role = "synth.lfo.delay"

[[roles]]
input = "track-knob-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "master-fader"
role = "rackforge.master.level"

# Play and Stop take the transport; their notes are the host's, and no
# instrument plays them.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
