# Novation Launchkey 88 [MK3], standalone (MIDI) mode, factory Custom Modes.
# Every value below is sourced in ../SOURCES.md; [PR] is the Programmer's
# Reference Guide v1, [UG] the User Guide v6, [CG] Novation's Components
# guide for the Launchkey MK3.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launchkey-mk3-88"
name = "Launchkey 88 [MK3]"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launchkey-88-mk3"

# The MIDI interface only: the DAW interface ("LKMK3 DAW", or the second
# interface on Windows, MIDIIN2) carries DAW mode, not the performance [PR p4].
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launchkey"]
name_contains_any = ["mk3"]
exclude_contains = ["mini", "daw", "midiin2", "flkey"]

# Universal Device Inquiry reply: F0 7E 00 06 02 00 20 29 <dev_type> 01 00 00
# <app version> F7, dev_type 40h for the 88 [PR p4].
[devices.sysex_identity]
manufacturer = [0x00, 0x20, 0x29]
family = 0xC0
model = 0x0000

# Pots, factory pot Custom Mode: CC 21-28 on the global (keys) channel,
# channel 1 by default [CG pots screenshot; UG p41].
[[inputs]]
id = "knob-1"
name = "Pot 1"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 21 }
slot = "control-2.1"

[[inputs]]
id = "knob-2"
name = "Pot 2"
kind = "knob"
group = "Pots"
