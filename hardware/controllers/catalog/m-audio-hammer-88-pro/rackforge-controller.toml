# M-Audio Hammer 88 Pro, in the DAW mode RackForge puts it in on connect.
# Every value below is sourced in SOURCES.md. Ableton Live 12's script for it
# is its Oxygen Pro script unchanged, and Bitwig's Oxygen Pro extension drives
# it as an Oxygen Pro 49 or 61 with eight faders and a master. So the
# controls, the messages and the tags below are the Oxygen Pro's: [UG] is the
# Oxygen Pro Series User Guide v1.1, [AB] Ableton's Oxygen Pro script, [BW]
# Bitwig's Oxygen Pro extension.
schema_version = 2
kind = "controller"
id = "org.rackforge.m-audio-hammer-88-pro"
name = "Hammer 88 Pro"
vendor = "M-Audio"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "hammer-88-pro"

# The controls speak on the third port pair: "MIDIIN3 (Hammer 88 Pro)" /
# "MIDIOUT3 (Hammer 88 Pro)" on Windows, "Hammer 88 Pro Mackie/HUI" on a Mac
# and on Linux [M-Audio's Hammer 88 Pro setup articles; BW Hammer port
# names]. The keys, wheels and pedals stay on the first port ("Hammer 88
# Pro", "... USB MIDI") and play as any keyboard does.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["hammer 88 pro"]
name_contains_any = ["midiin3", "mackie"]

# Where the mode messages go: the same third port, as an output.
[[devices.endpoints]]
role = "setup_output"
name_contains = ["hammer 88 pro"]
name_contains_any = ["midiout3", "mackie"]

# On connect, RackForge sends what Ableton and Bitwig send when they take the
# keyboard [AB midi.py, oxygen_pro.py on_identified; BW MidiProcessor]:
# F0 00 01 05 7F 00 00 <command> 00 01 <value> F7, M-Audio's ID 00 01 05.
# Command 6D value 02 is the Live firmware mode; 6E 02 then 6E 07 the record
# and device control modes. Both also send 6B 01 and 6C 03, which hand the
# LEDs to the host: RackForge does not drive them, so it leaves them to the
# keyboard.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6D 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 07 F7"
to = "setup_output"

# Knobs 1-8: CC 22-29, absolute, channel 1 [AB elements.py create_encoder;
# BW KNOB_1 = 0x16]. Above the faders, they are the second row.
