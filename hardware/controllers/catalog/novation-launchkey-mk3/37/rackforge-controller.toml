# Novation Launchkey 37 [MK3], standalone (MIDI) mode, factory Custom Modes.
# Every value below is sourced in ../SOURCES.md; [PR] is the Programmer's
# Reference Guide v1, [UG] the User Guide v6, [CG] Novation's Components
# guide for the Launchkey MK3.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launchkey-mk3-37"
name = "Launchkey 37 [MK3]"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launchkey-37-mk3"

# The MIDI interface only: the DAW interface ("LKMK3 DAW", or the second
# interface on Windows, MIDIIN2) carries DAW mode, not the performance [PR p4].
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launchkey"]
name_contains_any = ["mk3"]
exclude_contains = ["mini", "daw", "midiin2", "flkey"]

# Universal Device Inquiry reply: F0 7E 00 06 02 00 20 29 <dev_type> 01 00 00
# <app version> F7, dev_type 35h for the 37 [PR p4].
[devices.sysex_identity]
manufacturer = [0x00, 0x20, 0x29]
family = 0xB5
model = 0x0000

# Pots, factory pot Custom Mode: CC 21-28 on the global (keys) channel,
# channel 1 by default [CG pots screenshot; UG p41].
[[inputs]]
id = "knob-1"
name = "Pot 1"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 21 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Pot 2"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 22 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Pot 3"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 23 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Pot 4"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 24 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Pot 5"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 25 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Pot 6"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 26 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Pot 7"
kind = "knob"
group = "Pots"
midi = { channel = 0, cc = 27 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
