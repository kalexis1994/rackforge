# RackForge's default meanings, as for the other controllers with eight faders:
# the faders take the envelope, filter and LFO, the Send A knobs shape the
# tone. The Send B and Pan rows are left for the player.
[[roles]]
input = "send-a-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "send-a-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "send-a-3"
