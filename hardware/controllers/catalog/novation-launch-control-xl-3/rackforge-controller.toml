# Novation Launch Control XL 3, Mode 16: the default set of Control Changes
# that cannot be edited. Every value below is sourced in SOURCES.md; [UG] is
# the Launch Control XL 3 User Guide, [PR] its Programmer's Reference Guide
# 1.0, [AL] Novation's Ableton Live setup article for it.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launch-control-xl-3"
name = "Launch Control XL 3"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launch-control-xl-3"

# The MIDI interface only: "LCXL3 1 MIDI" on Windows, "LCXL3 1 (MIDI Out)" on
# a Mac, the number being the device ID [AL; PR p4]. The DAW interface is
# "LCXL3 1 MIDI (Port 2)" or "MIDIIN2 (...)" on Windows and "(DAW Out)" on a
# Mac [AL]. The Launch Control 3 is "LC3 1 MIDI" and never matches.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["lcxl3"]
exclude_contains = ["daw", "midiin2", "port 2", "midi 2 "]

# Its DAW port, where it takes the messages that change its mode: "LCXL3 1
# (DAW In)" on a Mac, "MIDIOUT2 (LCXL3 1 MIDI)" or "LCXL3 1 MIDI (Port 2)" on
# Windows [AL; PR p5].
[[devices.endpoints]]
role = "setup_output"
name_contains = ["lcxl3"]
name_contains_any = ["daw", "midiout2", "port 2", "midi 2 "]

# On connect, RackForge selects Mode 16, the mode described below: feature
# controls on (9Fh 0Bh 7Fh), then surface mode select, Control Change 1Eh on
# channel 7, value 1Dh for Custom Mode 16 [PR p16-17]. Both go to the DAW
# port. RackForge's own packages send without asking.
[permissions]
midi_input = true
midi_output = true

[[on_connect]]
message = "9F 0B 7F"
to = "setup_output"

[[on_connect]]
message = "B6 1E 1D"
to = "setup_output"

# Encoders, Mode 16: row 1 CC 13-20, row 2 CC 21-28, row 3 CC 29-36, on
