[package]
name = "rackforge-concert-grand"
description = "Physically modelled grand piano RackForge ships in every host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rackforge-plugin-sdk = { path = "../../crates/rackforge-plugin-sdk" }

[dev-dependencies]
cpal = "0.16.0"
midir = "0.11"
rackforge-core = { path = "../../crates/rackforge-core" }

[target.'cfg(windows)'.dev-dependencies]
rackforge-ump = { path = "../../crates/rackforge-ump" }
