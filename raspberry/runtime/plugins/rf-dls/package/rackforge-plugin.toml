schema_version = 1
id = "org.rackforge.rf-dls"
name = "RF-DLS"
vendor = "RackForge"
version = "0.1.0"
kind = "instrument"
state_version = 2
capabilities = [
    "audio_output",
    "midi_input",
    "presets",
    "state",
    "sample_accurate_automation",
]
ui_layouts = ["little@1"]

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

[api]
major = 1
minor = 4

[[resources]]
id = "dls-bank"
name = "DLS Sound Bank"
kind = "file"
required = true

[binaries]
linux-aarch64 = "lib/librackforge_rf_dls.so"
linux-x86_64 = "lib/librackforge_rf_dls.so"
windows-x86_64 = "lib/rackforge_rf_dls.dll"
