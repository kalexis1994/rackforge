[workspace]
resolver = "3"
members = [
    "rackforge-core",
    "rackforge-control-api",
    "rackforge-controller-api",
    "rackforge-controller-package",
    "rackforge-controller-host",
    "rackforge-dsp",
    "rackforge-plugin-api",
    "rackforge-program-api",
    "rackforge-session-api",
    "rackforge-surface-api",
    "rackforge-surface-runtime",
    "rackforge-ui",
    "plugins/gain",
    "plugins/rf-dls",
    "plugins/roland-scva",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
libloading = "0.8"
hound = "3.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
