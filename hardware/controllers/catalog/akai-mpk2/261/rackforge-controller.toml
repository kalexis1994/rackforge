# The wheels and the sustain pedal, on the keyboard's channel: pitch bend,
# and modulation CC 1 [UG items 3-4]; sustain CC 64 [UG rear panel, the
# MIDI standard].
[[inputs]]
id = "pitch-bend"
name = "Pitch-bend wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# Transport, CC on channel 1 in this preset [AB: Loop 114, Rewind 115,
# Fast-forward 116, Stop 117, Play 118, Record 119; UG: the five transport
# buttons send "pre-assigned MIDI CC values" among other types, and Loop is
# set per preset]. Rewind and fast-forward step the main selector.
[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 114 }

[[inputs]]
id = "rewind"
name = "Rewind"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 115 }
slot = "step.down"

[[inputs]]
id = "fast-forward"
name = "Fast-forward"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 116 }
slot = "step.up"

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

# RackForge's default meanings for eight knobs and eight faders, without a
# master fader.
[[roles]]
input = "knob-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "knob-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "knob-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "knob-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "knob-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "knob-7"
role = "synth.lfo.delay"

[[roles]]
input = "knob-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
