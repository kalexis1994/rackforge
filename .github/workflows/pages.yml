name: Publish the browser demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the WebAssembly targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      # The interface's package manager is pinned in web/package.json, and the
      # repository has no manifest at its root for an action to read one from.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the host and the instrument it plays
        run: ./tools/build-web-demo.sh

      - name: Check the host outside a browser
        run: |
          storage="$(mktemp -d)"
          cp -r web/public/demo/rackforge/. "$storage"
          node tools/check-browser-host.mjs web/public/demo/rackforge-browser.wasm "$storage"

      - name: Install the interface dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build the site
        run: pnpm build
        working-directory: web
        env:
          VITE_RACKFORGE_BROWSER_HOST: "1"
          # Project pages are served from /<repository>/.
          RACKFORGE_WEB_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
