# Wheels on the keys channel: pitch bend, and modulation on CC 1. The sustain
# input sends CC 64 by default [CG "Sustain Pedal"]. The pads and the buttons
# are not declared: Novation does not say what they send outside FL Studio.
[[inputs]]
id = "pitch-bend"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedal"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings, as for the other keyboards with eight knobs
# and nine faders: the pots shape the tone, the faders the envelope, filter
# and LFO, the ninth fader the master level.
[[roles]]
input = "pot-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "pot-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "pot-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "pot-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "pot-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "pot-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "pot-7"
role = "synth.lfo.delay"

[[roles]]
input = "pot-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "fader-9"
role = "rackforge.master.level"
