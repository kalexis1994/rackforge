# Buttons in standalone mode: Control Changes on channel 16 [PR p6 figure 1;
# names from UG p9-10].
[[inputs]]
id = "track-left"
name = "Track left"
kind = "button"
group = "Buttons"
midi = { channel = 15, cc = 103 }

[[inputs]]
id = "track-right"
name = "Track right"
kind = "button"
group = "Buttons"
midi = { channel = 15, cc = 102 }

[[inputs]]
id = "capture-midi"
name = "Capture MIDI"
kind = "button"
group = "Workflow"
midi = { channel = 15, cc = 74 }

[[inputs]]
id = "quantise"
name = "Quantise"
kind = "button"
