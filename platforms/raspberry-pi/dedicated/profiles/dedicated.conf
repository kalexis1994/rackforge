# The dedicated profile: the Pi is an instrument and nothing else.
#
# Every choice here is a value a module reads. `auto` means the module
# decides from the hardware it detects (see lib/hardware.sh); a value
# overrides it. A newer version of this file is applied like any other:
# `rackforge-pi plan` shows what changes, and what the new version stops
# asking for is put back.
PROFILE_ID=dedicated
PROFILE_VERSION=1

# --- CPU (modules/10-cpu.sh) ------------------------------------------------
# The governor held while the instrument runs.
GOVERNOR=performance
# Where the audio thread and the render workers run: a CPU list, or auto
# for what was measured best on this board (DEDICATED.md, D2).
AUDIO_CPUS=auto
RENDER_CPUS=auto
# How many render workers: a count, or auto for what was measured best on
# this board.
AUDIO_WORKERS=auto
# Where the storage, Wi-Fi and network interrupts go: a CPU list, auto, or
# keep.
IRQ_CPUS=auto

# --- Services (modules/20-services.sh) ---------------------------------------
# on, off, or auto: on when the hardware says the feature is in use.
BLUETOOTH=auto
# Automatic updates, scrubs and index rebuilds never start on their own;
# `rackforge-pi maintenance` runs them when the player chooses.
MAINTENANCE=manual
