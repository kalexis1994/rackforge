[package]
name = "rackforge-web"
description = "Isolated HTTP and WebSocket gateway for the RackForge SPA"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom.workspace = true
mime_guess = "2.0"
rackforge-control-api = { path = "../rackforge-control-api" }
rackforge-plugin-api = { path = "../rackforge-plugin-api" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http = { version = "0.6", features = ["fs", "trace"] }
