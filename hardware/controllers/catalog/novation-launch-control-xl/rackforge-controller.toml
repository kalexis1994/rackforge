# Novation Launch Control XL (MK1 and MK2), User Template 1 as it leaves the
# factory. Every value below is sourced in SOURCES.md; [PR] is the Programmer's
# Reference Guide v2, [CG] Novation's Components guide for the Launch Control
# XL MK1 and MK2, [AL] Novation's Ableton Live setup article for them.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launch-control-xl"
name = "Launch Control XL"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launch-control-xl"

# One MIDI port, "Launch Control XL n" where n is the device ID, not shown for
# ID 1 [PR p3]. The second interface is "MIDIIN2 (Launch Control XL)" on
# Windows and "Launch Control XL (HUI)" on a Mac [AL]. The Launch Control XL 3
# is "LCXL3 1 MIDI" and never matches.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launch control xl"]
exclude_contains = ["midiin2", "hui", "port 2", "midi 2 "]

# On connect, RackForge selects User Template 1, the template described below:
# "Change current template", F0 00 20 29 02 11 77 <template> F7, template 00h
# for User 1 [PR p8]. RackForge's own packages send without asking.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 20 29 02 11 77 00 F7"

# The Launch Control XL has no keys: none of its controls ever plays. Its
# buttons send notes, and its knobs' and faders' numbers are an instrument's
# controllers.

# Knobs: Send A row CC 13-20, Send B row CC 29-36, Pan/Device row CC 49-56,
# channel 1 [CG "Show Values" screenshot of the default User template].
[[inputs]]
id = "send-a-1"
name = "Send A 1"
kind = "knob"
group = "Send A"
midi = { channel = 0, cc = 13 }
slot = "control-2.1"
plays = false

