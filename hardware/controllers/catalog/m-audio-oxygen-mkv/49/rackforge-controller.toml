name = "Fader button 2"
kind = "button"
group = "Fader buttons"
midi = { channel = 0, cc = 33 }

[[inputs]]
id = "fader-button-3"
name = "Fader button 3"
kind = "button"
group = "Fader buttons"
midi = { channel = 0, cc = 34 }

[[inputs]]
id = "fader-button-4"
name = "Fader button 4"
kind = "button"
group = "Fader buttons"
midi = { channel = 0, cc = 35 }

[[inputs]]
id = "fader-button-5"
name = "Fader button 5"
kind = "button"
group = "Fader buttons"
midi = { channel = 0, cc = 36 }

[[inputs]]
id = "fader-button-6"
name = "Fader button 6"
