name = "Rewind"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 91 }
slot = "step.down"
plays = false

[[inputs]]
id = "forward"
name = "Fast-forward"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 92 }
slot = "step.up"
