name = "Pad 3"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 42 }

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 43 }

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 48 }

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 49 }

[[inputs]]
id = "pad-7"
name = "Pad 7"
