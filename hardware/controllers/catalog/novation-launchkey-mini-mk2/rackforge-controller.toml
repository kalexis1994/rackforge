# Novation Launchkey Mini, the first and the MK2, in Basic Mapping mode: what
# it sends without a DAW's InControl. Every value below is sourced in
# SOURCES.md; [UG] is the Launchkey Mini User Guide (2015, for both versions),
# [BW] Bitwig's Launchkey Mini extension.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launchkey-mini-mk2"
name = "Launchkey Mini [MK2]"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launchkey-mini-mk2"

# Its MIDI port: "Launchkey Mini" on Windows, "Launchkey Mini LK Mini MIDI" on
# a Mac, "Launchkey Mini MIDI 1" on Linux [BW port names]. The other port,
# InControl ("MIDIIN2 (...)", "... InControl", "... MIDI 2"), is the DAW's, as
# is the Mini MK3's "Launchkey Mini MIDI IN2". The Launchkey Mini MK3 and MK4
# name their mark.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launchkey mini"]
exclude_contains = ["midiin2", "in2", "incontrol", "midi 2", "mk3", "mk4"]

# Rotary controls 1-8: CC 21-28 on the keyboard's MIDI channel, channel 1 at
# power-on [UG p10 "ALWAYS defaults to MIDI channel 01", p11, MIDI Messages
# Table]. No faders: they take the first row.

[[inputs]]
id = "knob-1"
name = "Rotary 1"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 21 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Rotary 2"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 22 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Rotary 3"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 23 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Rotary 4"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 24 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Rotary 5"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 25 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Rotary 6"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 26 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Rotary 7"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 27 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Rotary 8"
kind = "knob"
group = "Rotaries"
midi = { channel = 0, cc = 28 }
slot = "control-1.8"

# Pads: notes on channel 10, always, in Basic Mapping mode [UG p10-11]: top row
# 40-43 48-51, bottom row 36-39 44-47 [UG MIDI Messages Table]. The
# Launchkey's layout: each pad takes the slot of the note it sends.

[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
