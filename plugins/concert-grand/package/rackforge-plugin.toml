schema_version = 2
id = "org.rackforge.concert-grand"
name = "RackForge Concert Grand"
vendor = "RackForge"
version = "0.74.0"
description = "Physically modelled grand piano: stiff strings, derived stretch tuning, hammer felt and two-stage decay, with no samples"
kind = "instrument"
state_version = 1
capabilities = ["audio_output", "midi_input", "presets", "state"]

# The instrument as photographed: black lacquer, the harp's gold, and the
# warm house lights of the hall it was shot in.
[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#000506"
accent_color = "#F3BC7C"

[api]
major = 1
minor = 5

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
