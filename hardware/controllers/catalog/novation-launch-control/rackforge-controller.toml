# The four buttons: up CC 114, down 115, left 116, right 117 [AB; GSG p1 "4
# buttons"]. Left and right step the main selector, up and down the second.

[[inputs]]
id = "up"
name = "Up"
kind = "button"
group = "Buttons"
midi = { channel = 8, cc = 114 }
slot = "step-2.up"
plays = false

[[inputs]]
id = "down"
name = "Down"
kind = "button"
group = "Buttons"
midi = { channel = 8, cc = 115 }
slot = "step-2.down"
plays = false

[[inputs]]
id = "left"
name = "Left"
kind = "button"
group = "Buttons"
midi = { channel = 8, cc = 116 }
slot = "step.down"
plays = false

[[inputs]]
id = "right"
name = "Right"
kind = "button"
group = "Buttons"
midi = { channel = 8, cc = 117 }
slot = "step.up"
plays = false

# RackForge's default meanings for eight knobs and no faders, on the top row;
# the bottom row is left for the player.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
