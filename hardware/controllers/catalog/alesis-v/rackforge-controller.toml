# Alesis V25, V49 and V61 (the first generation, not the MKII), in their
# factory settings. Alesis's guides give only the wheels; the knobs come
# from official software, the buttons and pads from community sources.
# Every value is sourced and labelled in SOURCES.md: [UG] the V25/V49/V61
# user guides, [AB] Ableton Live 12's Alesis_V script, [SX] Spectrasonics'
# Omnisphere 3 hardware guide pages for the V25, V49 and V61, [TM] tmick0's
# alesisvsysex (the factory settings read back from a unit), [BL] and [GH]
# two community configurations.
schema_version = 2
kind = "controller"
id = "org.rackforge.alesis-v"
name = "Alesis V"
vendor = "Alesis"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "alesis-v"

# The keys' port: "V25" / "V49" / "V61" on Windows, "V49 MIDI 1" on Linux;
# the second port is the editor's ("MIDIIN2 (V49)", "V49 MIDI 2", "EDITOR")
# [community ×4]. Every size has the same controls [UG]. The MKII carries
# "MKII"; the VI and VX series ("VI49", "VX49") never carry "v49".
[[devices.endpoints]]
role = "performance_input"
name_contains_any = ["v25", "v49", "v61"]
exclude_contains = ["mkii", "mk2", "editor", "midiin2", "midi 2"]

# Knobs 1-4: CC 20-23 on channel 1, absolute [AB; SX, as the factory
# default; community ×4]. They take the first row of slots and play when
# nothing maps them.

[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 20 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 21 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-1.4"

# The four CC buttons: CC 48-51 on channel 1, toggling 127 and 0 by default
# [TM; BL; GH]. The keyboard has pads, so no slot.

[[inputs]]
id = "button-1"
name = "Button 1"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 48 }
button = { latching = true }

[[inputs]]
id = "button-2"
name = "Button 2"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 49 }
button = { latching = true }

[[inputs]]
id = "button-3"
name = "Button 3"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 50 }
button = { latching = true }

[[inputs]]
id = "button-4"
name = "Button 4"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 51 }
button = { latching = true }

# Pads: notes on channel 10 [TM; BL; GH], which play and take the slot of
# the note they send. Pad 2 is 41 in two sources and 32 in the dump [TM]:
# see SOURCES.md. Which physical pad is the first is not documented; the
# order is the sources'.

[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 49 }
slot = "switch-2.2"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 46 }
slot = "switch-2.7"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

# The wheels: pitch bend and the modulation wheel, CC 1 [UG p4].

[[inputs]]
id = "pitch-wheel"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "mod-wheel"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The knobs take the catalog's first four roles (catalog README, "Eight
# knobs, no faders").

[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"
