[[devices]]
id = "arturia.keylab-essential-mk3"
usb_vendor_id = 0x1c75
usb_product_ids = [0x028c]
product_names = ["KeyLab Essential 61 mk3"]

[[devices.endpoints]]
role = "surface_input"
name_contains_any = ["keylab", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[devices.endpoints]]
role = "display_output"
name_contains_any = ["keylab", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[devices.endpoints]]
role = "performance_input"
name_contains_any = ["keylab", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[surfaces]]
layout_id = "little@1"
quality = "native"
priority = 0

[surfaces.gestures]
soft_key_long_press = true
emergency_home_chord = true

[[settings]]
id = "key-light-color"
name = "Key light color"
kind = "color"
default = "#145080"
