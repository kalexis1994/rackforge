# Akai Professional MPD218, on its Preset 1, "chroma10". Every value below
# is sourced in SOURCES.md; [PR] is Akai's own factory preset file,
# "Preset1-chroma10.mpd218", from its "MPD218 Factory Presets"; [UG] the
# MPD218 User Guide v1.0; [AB] Ableton Live 12's MPD218 script.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpd218"
name = "MPD218"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpd218"

# Its USB port, "MPD218" [AB model_name]. "mpd218" is in no sister's name
# (MPD226, MPD232, the older MPD18).
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpd218"]

# Knobs: six 360-degree knobs [UG item 3] in three control banks [UG item
# 4]. Bank A sends CC 3, 9, 12-15; bank B CC 16-21; bank C CC 22-27; 0-127,
# channel 1 [PR knob records]. Each bank fills a row of controls: A the
# first, B the second, C the third.
[[inputs]]
id = "knob-a1"
name = "Knob 1 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 3 }
slot = "control-1.1"

[[inputs]]
id = "knob-a2"
name = "Knob 2 (bank A)"
kind = "knob"
group = "Knobs, bank A"
midi = { channel = 0, cc = 9 }
