# Akai Professional MPK261, on its Preset 1, "LiveLite". Every value below is
# sourced in ../SOURCES.md; [UG] is the MPK261 User Guide v1.0, [AB] Ableton
# Live 12's MPK261 remote script, which reads that preset, [AKB] Akai's own
# Bitwig scripts for the MPK2 Series v1.0.8, [KB] Akai's article "MPK2
# Series | Setup in Ableton Live". [AB] is the only source for the preset's
# messages: see ../SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpk261"
name = "MPK261"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpk261"

# Port A, its first USB port, where the preset's controls speak: "MPK261"
# on Windows, "MPK261 Port A" on a Mac, "MPK261 MIDI 1" on Linux [AKB port
# names]. Port B ("MIDIIN2", "Port B", "MIDI 2"), the 5-pin MIDI port and
# the Remote port ("MIDIIN4", "Remote", "MIDI 4") are not the keyboard's
# controls. One endpoint per system, so no system's other ports are taken.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk261 port a"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk261 midi 1"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk261"]
exclude_contains = ["port", "midi", "remote"]

# Knobs 1-8, control bank A: CC 22-29, absolute, channel 1 [AB Encoders,
# make_encoder: MapMode.absolute]. They turn endlessly [UG item 11].
# Above the faders, they are the second row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-2.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-2.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 24 }
slot = "control-2.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 25 }
slot = "control-2.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 26 }
slot = "control-2.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 27 }
slot = "control-2.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 28 }
slot = "control-2.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 29 }
slot = "control-2.8"

