# Faders 1-8 take the catalog's roles (catalog README, "Rows of knobs and
# eight faders"): no master level. The knobs are relative, and roles read
# absolute controls only.
[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
