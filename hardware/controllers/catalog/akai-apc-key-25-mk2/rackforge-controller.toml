id = "knob-3"
name = "Knob 3"
kind = "encoder"
group = "Knobs"
midi = { channel = 0, cc = 50 }
encoder = "relative_twos_complement"
slot = "control-1.3"
plays = false

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "encoder"
group = "Knobs"
midi = { channel = 0, cc = 51 }
encoder = "relative_twos_complement"
slot = "control-1.4"
plays = false

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "encoder"
group = "Knobs"
midi = { channel = 0, cc = 52 }
encoder = "relative_twos_complement"
slot = "control-1.5"
plays = false

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "encoder"
group = "Knobs"
