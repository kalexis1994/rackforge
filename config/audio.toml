# The startup audio configuration RackForge hands to Core.
#
# Installers render this file into `<root>/config/audio.toml.example`,
# replacing @RACKFORGE_ROOT@ with the deployment root and
# @RACKFORGE_DEFAULT_PACKAGE@ with the bundled instrument they just
# installed. The rendered file is a working configuration: copy it to
# `config/audio.toml` and Core starts with it.
#
# It is also the seed the Web host copies the first time an instrument is
# activated, replacing `package` with that instrument and dropping `preset`.
# Everything else below reaches Core exactly as written, which is why this
# file carries nothing specific to one plugin or one machine.

schema_version = 3
package = "@RACKFORGE_DEFAULT_PACKAGE@"
data_root = "@RACKFORGE_ROOT@/data"

# Resource overrides belong to the plugin that declares them: Core refuses a
# configuration that overrides a resource the active plugin does not declare,
# so this seed carries none. Add them under a `[resources]` table only
# alongside a `package` that declares those ids.

[audio.output]
# `unique_compatible` is what makes this file portable. The device below is a
# pin, not a requirement: when it is absent and exactly one output can serve
# this profile, Core uses that one. With `none` a machine without this exact
# interface simply has no audio.
fallback = "unique_compatible"
# Core renders S32_LE and nothing else today. An output that cannot take it --
# a Raspberry Pi's headphone jack offers U8 and S16_LE only -- cannot be used
# by the engine whatever else is configured here.
sample_format = "s32_le"
sample_rate_hz = 48000
channels = 2
period_frames = 128
buffer_frames = 384

[audio.output.device]
mode = "usb"
vendor_id = 0x1235
product_id = 0x8211

# Audio capture is opt-in. Uncomment this section for a mono guitar connected
# to physical input 1 of the same interface. Keep rate and period equal to the
# output profile so both streams remain in one clock domain.
#
# [audio.input]
# fallback = "unique_compatible"
# sample_format = "s32_le"
# sample_rate_hz = 48000
# channels = [1]
# period_frames = 128
# buffer_frames = 384
# gain_db = 0
#
# [audio.input.device]
# mode = "usb"
# vendor_id = 0x1235
# product_id = 0x8211
