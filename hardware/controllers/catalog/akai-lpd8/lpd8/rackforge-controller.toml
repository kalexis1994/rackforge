# Akai Professional LPD8 (the first, 2009; not the LPD8 mk2 or the LPD8
# Wireless), on Program 1. Akai's guides give its layout but no factory
# values; every value below is sourced and labelled in SOURCES.md. [AB] is
# Ableton Live 12's LPD8 script, which reads Program 1; [QS] the LPD8
# Quickstart Guide; community sources are named there.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-lpd8"
name = "LPD8"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "lpd8"

# One port: "LPD8" on Windows and a Mac, "LPD8 MIDI 1" on Linux [AB
# model_name and INPUTPORT; community ×3]. The LPD8 mk2 names itself "LPD8
# mk2", and the LPD8 Wireless carries "wireless".
[[devices.endpoints]]
role = "performance_input"
name_contains = ["lpd8"]
exclude_contains = ["mk2", "wireless"]

# Knobs K1-K8: CC 1-8 on channel 1, absolute [AB consts.py; community ×4].
# K1-K4 are the top row, K5-K8 the bottom one [QS layout]. The LPD8 has no
# keys: its knobs never play (catalog README). No faders: the knobs take the
# first row.

[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 1 }
slot = "control-1.1"
plays = false

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 2 }
slot = "control-1.2"
plays = false

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 3 }
slot = "control-1.3"
plays = false

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 4 }
slot = "control-1.4"
plays = false

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 5 }
slot = "control-1.5"
plays = false

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 6 }
slot = "control-1.6"
plays = false

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 7 }
slot = "control-1.7"
plays = false

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 8 }
slot = "control-1.8"
plays = false

# Pads 1-8: notes 36-43 on channel 1 [AB config.py PAD_TRANSLATION;
# community ×4]. Pads 1-4 are the bottom row and 5-8 the top one [QS
# layout]. They are drum pads: they play, and take the slot of the note they
# send.

[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 43 }
slot = "switch-1.4"

# The knobs take the catalog's roles (catalog README, "Eight knobs, no
# faders").

[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
