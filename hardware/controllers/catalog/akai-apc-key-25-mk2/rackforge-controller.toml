# Akai Professional APC Key 25 mk2, its control port. Every value below is
# sourced in SOURCES.md; [CP] is Akai's APC Key 25 mk2 Communication
# Protocol v1.1, [UG] its User Guide v1.2, [AB] Ableton Live 12's
# APC_Key_25_mk2 script, [BW] Bitwig's APC Key 25 mk2 extension. [CP] is the
# maker's own table of every message.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-apc-key-25-mk2"
name = "APC Key 25 mk2"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "apc-key-25-mk2"

# The knobs, grid and buttons speak on the control port [CP "Port 1"]:
# "APC Key 25 mk2 Control" on a Mac and Linux, "MIDIIN2 (APC Key 25 mk2)" on
# Windows [BW port names]. The keys and sustain pedal play on the other port,
# "... Keys" or "APC Key 25 mk2" [CP "Port 0"; BW]. "mk2" keeps the first
# APC Key 25 out, which sends other messages.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["apc key 25 mk2"]
name_contains_any = ["control", "midiin2"]

# These controls, on the control port, never play: the grid and buttons send
# notes, the knobs control changes. The keys, on their own port, play.

# Knobs 1-8: CC 48-55 on channel 1, relative [CP Knobs table], in two's
# complement, accelerated [AB Encoders, MapMode.AccelTwoCompliment]. No
# faders: they take the first row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "encoder"
group = "Knobs"
midi = { channel = 0, cc = 48 }
encoder = "relative_twos_complement"
slot = "control-1.1"
plays = false

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "encoder"
group = "Knobs"
midi = { channel = 0, cc = 49 }
encoder = "relative_twos_complement"
slot = "control-1.2"
plays = false

