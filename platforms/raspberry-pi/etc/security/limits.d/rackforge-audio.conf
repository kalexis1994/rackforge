# Real-time limits for RackForge's audio path.
#
# systemd is the authoritative grant for the supervised services: the unit's
# LimitRTPRIO and LimitMEMLOCK apply regardless of this file. This file exists
# for the case systemd does not cover — running rackforge-core from a shell
# during development or diagnosis — so that a hand-started host behaves like
# the supervised one instead of silently losing real-time scheduling.
#
# Scoped to the `rackforge` group rather than `audio`. Every audio-group process
# on the machine does not need to be able to preempt the scheduler; only this
# instrument does.

@rackforge   -   rtprio     95
@rackforge   -   memlock    unlimited
