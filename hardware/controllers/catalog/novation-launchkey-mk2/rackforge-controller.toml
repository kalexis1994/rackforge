[[inputs]]
id = "fader-8"
name = "Slider 8"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 48 }
slot = "control-1.8"
plays = false

[[inputs]]
id = "fader-9"
name = "Master slider"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 7 }
plays = false

# The buttons below the sliders (49 and 61): CC 51-58, the ninth CC 59, 127 on
# press and 0 on release [PR p15; AB Mute_Button_n range(51, 59), Master_Button
# 59]. Fader buttons on a keyboard with pads: no slot.

[[inputs]]
id = "fader-button-1"
name = "Button 1"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 51 }
plays = false

[[inputs]]
id = "fader-button-2"
name = "Button 2"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 52 }
plays = false

[[inputs]]
id = "fader-button-3"
name = "Button 3"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 53 }
plays = false

[[inputs]]
id = "fader-button-4"
name = "Button 4"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 54 }
plays = false

[[inputs]]
id = "fader-button-5"
name = "Button 5"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 55 }
plays = false

[[inputs]]
