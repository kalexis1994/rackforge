[workspace]
resolver = "3"
members = [
    "rackforge-core",
    "rackforge-audio-api",
    "rackforge-control-api",
    "rackforge-controller-api",
    "rackforge-controller-package",
    "rackforge-controller-host",
    "rackforge-dsp",
    "rackforge-midi-api",
    "rackforge-platform-api",
    "rackforge-platform-host",
    "rackforge-performance-api",
    "rackforge-plugin-api",
    "rackforge-program-api",
    "rackforge-repository",
    "rackforge-session-api",
    "rackforge-surface-api",
    "rackforge-surface-runtime",
    "rackforge-ui",
    "rackforge-web",
    "rackforge-store",
    "plugins/gain",
    "plugins/roland-scva",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = "3.0"
getrandom = "0.3"
libloading = "0.8"
hound = "3.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = "3.3"
url = "2.5"
zeroize = "1.8"
zip = { version = "8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
