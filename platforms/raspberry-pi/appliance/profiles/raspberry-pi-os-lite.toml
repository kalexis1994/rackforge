schema_version = 1
id = "org.rackforge.appliance.raspberry-pi-os-lite"
hardware_profiles = [
  "org.rackforge.hardware.raspberry-pi-4",
  "org.rackforge.hardware.raspberry-pi-5",
]
os_family = "raspberry-pi-os-lite"
network_provider = "org.rackforge.provider.network-manager"

[boot]
metric = "power-on-to-ready-to-play"
audio_requires_network = false
display_requires_network = false
web_process_requires_network = false

[provisioning]
disable_cloud_init_after_successful_first_boot = true
require_local_user = true
require_ssh_host_keys = true
require_network_profile = true

[services]
# Swap providers vary by image generation; each is probed, never assumed.
# `mlockall` already pins the audio path, so what is actually being avoided is
# the zram writeback timer's scheduled I/O to the SD card.
disable_after_provisioning = [
  "NetworkManager-wait-online.service",
  "dphys-swapfile.service",
  "systemd-zram-setup@zram0.service",
  "rpi-zram-writeback.timer",
]
keep = [
  "NetworkManager.service",
  "ssh.service",
  "avahi-daemon.service",
  "bluetooth.service",
  "rpi-eeprom-update.service",
]

[filesystem]
netplan_policy_mode = "0600"

[headless_boot]
camera_auto_detect = false
dsi_display_auto_detect = false
preserve_hdmi_kms = true

# The platform grants these limits; the host must still request them. Both
# halves are required, and the host reports which one is missing at startup.
[realtime]
audio_scheduler = "SCHED_FIFO"
audio_priority = 75
audio_priority_ceiling = 95
lock_audio_memory = true
cpu_governor = "performance"
swap = false
degraded_start_is_allowed = true

[rollback]
state_root = "/var/lib/rackforge/appliance"
