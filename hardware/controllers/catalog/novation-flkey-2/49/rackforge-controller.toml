# Wheels on the keys channel: pitch bend, and modulation on CC 1 by default [CG
# "Mod Wheel/Strip"]; the sustain input sends CC 64 by default [CG "Pedal"]. The
# pads start in Drum mode, whose notes Novation does not list, and the buttons
# are described in FL Studio only, so neither is declared.
[[inputs]]
id = "pitch-bend"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedal"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings, as for the other keyboards with eight knobs and
# nine faders: the encoders shape the tone, the faders the envelope, filter and
# LFO, the ninth fader the master level.
[[roles]]
input = "encoder-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "encoder-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "encoder-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "encoder-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "encoder-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "encoder-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "encoder-7"
role = "synth.lfo.delay"

[[roles]]
input = "encoder-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "fader-9"
role = "rackforge.master.level"
