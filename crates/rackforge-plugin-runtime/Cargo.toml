[package]
name = "rackforge-plugin-runtime"
description = "Host runtime for portable wasm-v1 RackForge plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true

# The browser backend uses the engine already present in the page, so the
# compiler is only a dependency of the native hosts.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime.workspace = true

[dev-dependencies]
wat = "1.245"
