# Novation Launchkey 25, 49 and 61 [MK2], in Extended (InControl) mode, which
# RackForge puts it in on connect. Every value below is sourced in SOURCES.md;
# [PR] is the Launchkey MK2 Programmer's Reference Guide 1.01, [AB] Ableton Live
# 12's Launchkey_MK2 script, [BW] Bitwig's Launchkey MK2 extension.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launchkey-mk2"
name = "Launchkey [MK2]"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launchkey-mk2"

# In Extended mode the pots, sliders and buttons send on the InControl port
# [PR p4]: "MIDIIN2 (Launchkey MIDI)" on Windows, "Launchkey MIDI MIDI 2" on
# Linux [BW port names], "LaunchKey InControl" on a Mac [PR p4]. No name
# carries the size, and the three have the same controls but the 25's
# missing sliders and buttons: one package reads them all. The keys, wheels
# and pads stay on the MIDI port and play. The first Launchkey names its size
# ("Launchkey 49"), the Minis and later models themselves otherwise.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launchkey"]
name_contains_any = ["midiin2 (launchkey midi)", "launchkey midi midi 2", "incontrol"]
exclude_contains = ["launchkey mini", "launchkey 25", "launchkey 49", "launchkey 61", "mk3", "mk4"]

# Where the mode messages go: the InControl port, as an output [PR p3].
[[devices.endpoints]]
role = "setup_output"
name_contains = ["launchkey"]
name_contains_any = ["midiout2 (launchkey midi)", "launchkey midi midi 2", "incontrol"]
exclude_contains = ["launchkey mini", "launchkey 25", "launchkey 49", "launchkey 61", "mk3", "mk4"]

# On connect: Extended mode on (9F 0C 7F), the pots' and sliders' sections to
# InControl (9F 0D 7F, 9F 0E 7F), and the drum pads' back to basic (9F 0F 00),
# so the pads keep playing on the MIDI port [PR p4-5; BW and AB send the first
# three].
[permissions]
midi_input = true
midi_output = true

[[on_connect]]
message = "9F 0C 7F"
to = "setup_output"

[[on_connect]]
message = "9F 0D 7F"
to = "setup_output"

[[on_connect]]
message = "9F 0E 7F"
to = "setup_output"

[[on_connect]]
message = "9F 0F 00"
to = "setup_output"

# Pots 1-8: CC 21-28 on channel 16, absolute [PR p14; AB make_encoder, range(21,
# 29) on channel 16, absolute; BW]. They take the second row, below the
# sliders; on the 25, which has none, the first row stays empty.

[[inputs]]
id = "knob-1"
name = "Pot 1"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 21 }
slot = "control-2.1"
plays = false

[[inputs]]
id = "knob-2"
name = "Pot 2"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 22 }
slot = "control-2.2"
plays = false

[[inputs]]
id = "knob-3"
name = "Pot 3"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 23 }
slot = "control-2.3"
plays = false

[[inputs]]
id = "knob-4"
name = "Pot 4"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 24 }
slot = "control-2.4"
plays = false

[[inputs]]
id = "knob-5"
name = "Pot 5"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 25 }
slot = "control-2.5"
plays = false

[[inputs]]
id = "knob-6"
name = "Pot 6"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 26 }
slot = "control-2.6"
plays = false

[[inputs]]
id = "knob-7"
name = "Pot 7"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 27 }
slot = "control-2.7"
plays = false

[[inputs]]
id = "knob-8"
name = "Pot 8"
kind = "knob"
group = "Pots"
midi = { channel = 15, cc = 28 }
slot = "control-2.8"
plays = false

# Sliders 1-8 (49 and 61): CC 41-48 on channel 16, the ninth, the master, CC 7
# [PR p14; AB make_slider range(41, 49) and 7 on channel 16]. Sliders 1-8 take
# the first row; the master slider no slot.

[[inputs]]
id = "fader-1"
name = "Slider 1"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 41 }
slot = "control-1.1"
plays = false

[[inputs]]
id = "fader-2"
name = "Slider 2"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 42 }
slot = "control-1.2"
plays = false

[[inputs]]
id = "fader-3"
name = "Slider 3"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 43 }
slot = "control-1.3"
plays = false

[[inputs]]
id = "fader-4"
name = "Slider 4"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 44 }
slot = "control-1.4"
plays = false

[[inputs]]
id = "fader-5"
name = "Slider 5"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 45 }
slot = "control-1.5"
plays = false

[[inputs]]
id = "fader-6"
name = "Slider 6"
kind = "fader"
group = "Sliders"
midi = { channel = 15, cc = 46 }
slot = "control-1.6"
plays = false

[[inputs]]
id = "fader-7"
name = "Slider 7"
kind = "fader"
