[[inputs]]
id = "fader-button-9"
name = "Master button"
kind = "button"
group = "Slider buttons"
midi = { channel = 15, cc = 59 }
plays = false

# Track < >: CC 102 and 103 [AB Track_Left_Button 102, Track_Right_Button 103; BW
# 102 previous track, 103 next; PR p15 lists them the other way round, which
# the two scripts contradict]. They step the main selector.

[[inputs]]
id = "track-previous"
name = "Track <"
kind = "button"
group = "Navigation"
midi = { channel = 15, cc = 102 }
slot = "step.down"
plays = false

[[inputs]]
id = "track-next"
name = "Track >"
kind = "button"
group = "Navigation"
midi = { channel = 15, cc = 103 }
slot = "step.up"
plays = false

# Transport: Rewind 112, Fast Forward 113, Stop 114, Play 115, Loop 116, Record
# 117, 127 on press [PR p15; AB Stop 114, Play 115, Loop 116, Record 117; BW
# the same]. Rewind and Fast Forward step the second selector.

[[inputs]]
id = "rewind"
name = "Rewind"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 112 }
slot = "step-2.down"
plays = false

[[inputs]]
id = "fast-forward"
name = "Fast Forward"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 113 }
slot = "step-2.up"
plays = false

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 114 }
plays = false

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 115 }
plays = false

[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 116 }
plays = false

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 117 }
plays = false

# The Launchkey answers each mode message with the same note on the InControl
# port, and its InControl buttons send them when pressed: notes 12-15 on
# channel 16 [PR p4-5]. They are the keyboard's state, never notes to play.

[[inputs]]
id = "extended-mode"
name = "Extended mode (echo)"
kind = "button"
group = "InControl"
midi = { channel = 15, note = 12 }
plays = false

[[inputs]]
id = "incontrol-pots"
name = "InControl: pots"
kind = "button"
group = "InControl"
midi = { channel = 15, note = 13 }
plays = false

[[inputs]]
id = "incontrol-sliders"
name = "InControl: sliders"
kind = "button"
group = "InControl"
midi = { channel = 15, note = 14 }
plays = false

[[inputs]]
id = "incontrol-pads"
name = "InControl: pads"
kind = "button"
group = "InControl"
midi = { channel = 15, note = 15 }
plays = false

# RackForge's default meanings for eight knobs and nine faders.
[[roles]]
input = "knob-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "knob-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "knob-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "knob-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "knob-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "knob-7"
role = "synth.lfo.delay"

[[roles]]
input = "knob-8"
role = "synth.amplifier.level"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "fader-9"
role = "rackforge.master.level"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
