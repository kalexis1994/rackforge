[package]
name = "rf-dls"
version = "0.1.0"
edition = "2024"
description = "Generic DLS Level 1/2 sample engine for RackForge"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0"
hound = "3.5"
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.10"
libc = "0.2"
midir = "0.11"

[lib]
name = "rf_dls"
path = "src/lib.rs"

[[bin]]
name = "rf-dls"
path = "src/main.rs"

[[bin]]
name = "rf-dls-live"
path = "src/bin/rf_dls_live.rs"
