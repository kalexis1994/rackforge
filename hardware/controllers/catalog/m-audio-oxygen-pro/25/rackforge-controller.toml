[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "pad"
group = "Pads"
midi = { channel = 0, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "pad"
