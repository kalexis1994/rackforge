# Arturia KeyLab 88 mkII, in the DAW mode RackForge puts it in on connect.
# Every value below is sourced in ../SOURCES.md; [BW] is Bitwig's KeyLab mkII
# extension, [AB] Ableton Live 12's KeyLab_mkII script and the KeyLab_Essential
# script it builds on, [UM] the KeyLab MkII User Manual 2.2. [BW] and [AB] are
# official software: both recall the keyboard's DAW memory with the same
# message and read the same controls, value for value.
schema_version = 2
kind = "controller"
id = "org.rackforge.arturia-keylab-mkii-88"
name = "KeyLab 88 mkII"
vendor = "Arturia"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "keylab-mkii-88"

# The controls speak on the second port pair, the DAW port: "MIDIIN2 (KeyLab
# mkII 88)" / "MIDIOUT2 (KeyLab mkII 88)" on Windows, "KeyLab mkII 88
# DAW" on a Mac, "KeyLab mkII 88 MIDI 2" on Linux [BW port names]. The keys,
# wheels and pedals stay on the first port and play as any keyboard does. The
# size is in every name: the 49, 61 and 88 never meet.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["keylab mkii 88"]
name_contains_any = ["midiin2", "daw", "midi 2"]

# Where the mode messages go: the same port, as an output.
[[devices.endpoints]]
role = "setup_output"
name_contains = ["keylab mkii 88"]
name_contains_any = ["midiout2", "daw", "midi 2"]

# On connect, RackForge sends what Bitwig sends when it takes the keyboard [BW
# init]: the DAW preset's protocol, Live (F0 00 20 6B 7F 42 02 00 40 52 02
# F7), then a recall of memory 2, the DAW preset (F0 00 20 6B 7F 42 05 02
# F7). Ableton recalls the same memory with the same message [AB sysex.py,
# DAW_MEMORY_PRESET_INDEX = 2].
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 20 6B 7F 42 02 00 40 52 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 20 6B 7F 42 05 02 F7"
to = "setup_output"

# Faders 1-9: pitch bend, one channel each, 1-9 [BW createFader,
# createAbsolutePitchBendValueMatcher(index); AB Fader_n on channel n, and the
# master fader on channel 9]. Pitch bend from a fader must never bend an
# instrument: they never play. Faders 1-8 take the first row; the ninth, the
# master fader, no slot.

[[inputs]]
id = "fader-1"
name = "Fader 1"
kind = "fader"
group = "Faders"
midi = { channel = 0, pitch_bend = true }
slot = "control-1.1"
plays = false

[[inputs]]
