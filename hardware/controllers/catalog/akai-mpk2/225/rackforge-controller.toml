# Akai Professional MPK225, on its Preset 1, "LiveLite". Every value below is
# sourced in ../SOURCES.md; [UG] is the MPK225 User Guide v1.0, [AB] Ableton
# Live 12's MPK225 remote script, which reads that preset, [AKB] Akai's own
# Bitwig scripts for the MPK2 Series v1.0.8, [KB] Akai's article "MPK2
# Series | Setup in Ableton Live". [AB] is the only source for the preset's
# messages: see ../SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpk225"
name = "MPK225"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpk225"

# Port A, its first USB port, where the preset's controls speak: "MPK225"
# on Windows, "MPK225 Port A" on a Mac, "MPK225 MIDI 1" on Linux [AKB port
# names]. Port B ("MIDIIN2", "Port B", "MIDI 2"), the 5-pin MIDI port and
# the Remote port ("MIDIIN4", "Remote", "MIDI 4") are not the keyboard's
# controls. One endpoint per system, so no system's other ports are taken.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk225 port a"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk225 midi 1"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk225"]
exclude_contains = ["port", "midi", "remote"]

# Knobs 1-8, control bank A: CC 22-29, absolute, channel 1 [AB Encoders,
# make_encoder: MapMode.absolute]. They turn endlessly [UG item 11].
# No faders: the knobs take the first row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 24 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 25 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 26 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 27 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 28 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 29 }
slot = "control-1.8"

# The 4 switches are left out: [AB] reads none on the MPK225, and no
# other source says what they send in this preset.

# Pads, bank A: notes on channel 2, white keys up from middle C, 60 to
# 72 [AB Drum_Pads, channel 1 zero-based]. Pads 1-4 are the bottom row
# and 5-8 the top one [AB, top row first]. The other pad banks are not in
# [AB]. A pad takes the slot of the pad in its place on a 36-51 grid, so it
# does what the pads in that place on every other keyboard do.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 60 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 62 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 64 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 65 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 67 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 69 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 71 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 1, note = 72 }
slot = "switch-1.4"

# The wheels and the sustain pedal, on the keyboard's channel: pitch bend,
# and modulation CC 1 [UG items 3-4]; sustain CC 64 [UG rear panel, the
# MIDI standard].
[[inputs]]
id = "pitch-bend"
name = "Pitch-bend wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# Transport, CC on channel 1 in this preset [AB: Loop 114, Rewind 115,
# Fast-forward 116, Stop 117, Play 118, Record 119; UG: the five transport
# buttons send "pre-assigned MIDI CC values" among other types, and Loop is
# set per preset]. Rewind and fast-forward step the main selector.
[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 114 }

[[inputs]]
id = "rewind"
name = "Rewind"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 115 }
slot = "step.down"

[[inputs]]
id = "fast-forward"
name = "Fast-forward"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 116 }
slot = "step.up"

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

# RackForge's default meanings for eight knobs and no faders: tone on knobs
# 1-4, the amp envelope on knobs 5-8.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
