name: Publish the browser demo

# The site also carries RackForge's official plugin catalog, signed, at
# /repository/v1/ -- see docs/architecture/plugin-repositories.md. It is
# rebuilt from the plugins' own releases every day and whenever a plugin
# repository announces a release with a `plugin-released` repository_dispatch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * *"
  repository_dispatch:
    types: [plugin-released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the WebAssembly targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rackforge-browser-demo
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The interface's package manager is pinned in web/package.json, and the
      # repository has no manifest at its root for an action to read one from.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22 dies with SIGSEGV inside its own WASI file handling while
          # the check reads the demo's storage; see the step below.
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the host and the instrument it plays
        run: ./tools/build-web-demo.sh

      # Every capability the host claims in crates/rackforge-host-capabilities
      # is exercised here, so the parity table cannot promise what the host
      # does not do.
      - name: Check the host against what it claims
        run: |
          storage="$(mktemp -d)"
          probe_source="$(mktemp -d)"
          cp -r web/public/demo/rackforge/. "$storage"
          cargo build --release --target wasm32-unknown-unknown -p rackforge-demo-synth
          cp -r plugins/demo-synth/package/. "$probe_source"
          cp target/wasm32-unknown-unknown/release/rackforge_demo_synth.wasm \
            "$probe_source/component.wasm"
          python3 tools/make-probe-package.py \
            "$probe_source" "$RUNNER_TEMP/probe.rfplugin"
          # CHECK_TRACE_CALLS=1 names every plugin and WASI call, for when
          # this dies somewhere that leaves no other trace.
          node tools/check-browser-host.mjs \
            web/public/demo/rackforge-browser.wasm "$storage" "$RUNNER_TEMP/probe.rfplugin"

      - name: Install the interface dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      # Project pages are served from /<repository>/. Read from the
      # environment rather than the event: a scheduled run's event carries no
      # repository, and an empty name built a site rooted at "//".
      - name: Build the site
        run: RACKFORGE_WEB_BASE="/${GITHUB_REPOSITORY#*/}/" pnpm build
        working-directory: web
        env:
          VITE_RACKFORGE_BROWSER_HOST: "1"

      # tools/build-live-page.py has existed since the page was written, but
      # nothing ran it, so the self-contained piano was never published and
      # its URL 404'd. It embeds the host, the worklet and the package, so it
      # has to run after both the demo assets and the site build.
      - name: Build the self-contained Concert Grand page
        run: python3 tools/build-live-page.py web/dist/concert-grand-live.html

      # A plugin that cannot be read or checked is left out and annotated;
      # when nothing can be built, or nothing can be signed, the catalog that
      # is already published stays, so a GitHub outage never takes it down.
      - name: Build the plugin catalog
        continue-on-error: true
        env:
          # Anonymous API calls are rate limited hard enough to fail on a busy
          # runner; the default token only reads public releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build-plugin-catalog.py --output "$RUNNER_TEMP/catalog"

      - name: Sign the plugin catalog
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.RACKFORGE_CATALOG_SIGNING_KEY }}
        run: |
          published="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/repository/v1"
          catalog="$RUNNER_TEMP/catalog/v1"
          site=web/dist/repository/v1
          mkdir -p "$site"
          keep_published() {
            echo "::warning title=Plugin catalog unchanged::$1"
            curl -fsSL "$published/index.json" -o "$site/index.json" \
              && curl -fsSL "$published/index.json.sig" -o "$site/index.json.sig" \
              || rm -rf web/dist/repository
          }
          if [[ -z "$SIGNING_KEY" ]]; then
            keep_published "RACKFORGE_CATALOG_SIGNING_KEY is not set, so nothing new can be signed."
            exit 0
          fi
          if [[ ! -f "$catalog/index.json" ]]; then
            keep_published "No plugin catalog could be built."
            exit 0
          fi
          key="$RUNNER_TEMP/catalog.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          cp "$catalog/index.json" "$site/index.json"
          cargo run --release --locked -p rackforge-store -- \
            sign "$site/index.json" "$key" "$site/index.json.sig"
          # Checked against the key RackForge itself trusts, so a secret that
          # does not match it fails here rather than on every player's machine.
          cargo run --release --locked -p rackforge-store -- \
            verify "$site/index.json" "$site/index.json.sig" official org.rackforge.official

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy browser demo
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
