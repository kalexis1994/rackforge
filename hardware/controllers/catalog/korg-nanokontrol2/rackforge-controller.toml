# Korg nanoKONTROL2, in CC mode with its factory scene. Every value below is
# sourced in SOURCES.md; [MI] is Korg's nanoKONTROL2 MIDI Implementation
# (Revision 1.00), [PG] its Parameter Guide E1, [OM] its Owner's Manual,
# [MX] Mixxx's nanoKONTROL2 mapping, [OV] Overtone's nanoKONTROL2 device.
# Korg tables the controls' numbers for its native mode; the factory CC
# scene sends the same numbers on channel 1 [MX; OV].
schema_version = 2
kind = "controller"
id = "org.rackforge.korg-nanokontrol2"
name = "nanoKONTROL2"
vendor = "Korg"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "nanokontrol2"

# Its one input: "nanoKONTROL2 SLIDER/KNOB" on a Mac and with Korg's
# Windows driver, "nanoKONTROL2" with Windows' own driver [OM "nanoKONTROL2
# and driver ports"], "nanoKONTROL2 MIDI 1" on Linux. The CTRL port is the
# output. "nanokontrol2" is in neither the first nanoKONTROL's name nor the
# nanoKONTROL Studio's.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["nanokontrol2"]
exclude_contains = ["ctrl"]

# Sliders 1-8: CC 0-7, channel 1 [MI native mode "Group 1 Slider 00, Group
# 2 ~ 8 Slider 01 ~ 07"; MX; OV]. They take the first row.
[[inputs]]
id = "slider-1"
name = "Slider 1"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 0 }
slot = "control-1.1"

[[inputs]]
id = "slider-2"
name = "Slider 2"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 1 }
slot = "control-1.2"

[[inputs]]
id = "slider-3"
name = "Slider 3"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 2 }
slot = "control-1.3"

[[inputs]]
id = "slider-4"
name = "Slider 4"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 3 }
slot = "control-1.4"

[[inputs]]
id = "slider-5"
name = "Slider 5"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 4 }
slot = "control-1.5"

[[inputs]]
id = "slider-6"
name = "Slider 6"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 5 }
slot = "control-1.6"

[[inputs]]
id = "slider-7"
name = "Slider 7"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 6 }
slot = "control-1.7"

[[inputs]]
id = "slider-8"
name = "Slider 8"
kind = "fader"
group = "Sliders"
midi = { channel = 0, cc = 7 }
slot = "control-1.8"

# Knobs 1-8: CC 16-23, channel 1 [MI native mode 10 ~ 17 hex; MX; OV]. They
# take the second row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 16 }
slot = "control-2.1"

[[inputs]]
