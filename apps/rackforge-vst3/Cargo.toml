[package]
name = "rackforge-vst3"
description = "RackForge instrument host for VST3-compatible DAWs"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
rackforge-core = { path = "../../crates/rackforge-core" }
rackforge-plugin-api = { path = "../../crates/rackforge-plugin-api" }
rackforge-repository = { path = "../../crates/rackforge-repository" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
vst3 = "=0.3.0"

[target.'cfg(windows)'.dependencies]
# Only the editor web host reads these, and it is built for the WebView.
rackforge-resource-api = { path = "../../crates/rackforge-resource-api" }
rackforge-resource-host = { path = "../../crates/rackforge-resource-host" }
include_dir = "0.7"
mime_guess = "2.0"
raw-window-handle = "0.6"
# Opens About's project link in the system browser, as the desktop app does.
webbrowser = "1.0"
wry = { version = "0.56.0", default-features = false, features = ["os-webview"] }
# Pinned to the exact version wry 0.56 depends on: naming ICoreWebView2Environment
# ourselves must not pull a second copy of the COM types.
webview2-com = "=0.38.2"
