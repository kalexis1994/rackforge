# The buttons, CC on the keyboard's channel, 127 and 0 [UG MIDI Messages
# Table]: the round buttons 108 and 109, the arrows up and down 104 and 105,
# Track < > 106 and 107. They are the keyboard's navigation, never notes or
# controls to play. Track < > step the main selector, the arrows the second.

[[inputs]]
id = "round-top"
name = "Round button, top"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 108 }
plays = false

[[inputs]]
id = "round-bottom"
name = "Round button, bottom"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 109 }
plays = false

[[inputs]]
id = "arrow-up"
name = "Arrow up"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 104 }
slot = "step-2.up"
plays = false

[[inputs]]
id = "arrow-down"
name = "Arrow down"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 105 }
slot = "step-2.down"
plays = false

[[inputs]]
id = "track-previous"
name = "Track <"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 106 }
slot = "step.down"
plays = false

[[inputs]]
id = "track-next"
name = "Track >"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 107 }
slot = "step.up"
plays = false

# RackForge's default meanings for eight knobs and no faders.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"
