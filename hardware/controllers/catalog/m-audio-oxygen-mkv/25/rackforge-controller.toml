# M-Audio Oxygen 25 (MKV, fifth generation), in the DAW mode RackForge
# puts it in on connect. Every value below is sourced in ../SOURCES.md; [UG]
# is the Oxygen Series MKV User Guide v1.2, [AB] Ableton Live 12's
# Oxygen_5th_Gen remote script: the Oxygen Pro script with its own mode byte.
# [AB] is the only source for the controls' messages: see SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.m-audio-oxygen-mkv-25"
name = "Oxygen 25 [MKV]"
vendor = "M-Audio"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "oxygen-25-mkv"

# The controls speak on the second port pair, the one [AB] reads and writes:
# "MIDIIN2 (Oxygen 25 MKV)" / "MIDIOUT2 (...)" on Windows [M-Audio's Pro
# Tools and FL Studio setup articles]; on a Mac M-Audio names it both "Oxygen
# 25 DAW" and "Oxygen 25 MKV Mackie/HUI". The keys, wheels and pedal
# stay on the first port. "oxygen 25" is never in an Oxygen Pro's names
# ("Oxygen Pro 25").
[[devices.endpoints]]
role = "performance_input"
name_contains = ["oxygen 25"]
name_contains_any = ["midiin2", "mackie", "daw"]

[[devices.endpoints]]
role = "setup_output"
name_contains = ["oxygen 25"]
name_contains_any = ["midiout2", "mackie", "daw"]

# On connect, what [AB] sends it: the Oxygen Pro's messages with the MKV's
# firmware mode byte, 6D 00 (Oxygen_5th_Gen.LIVE_MODE_BYTE = 0), then 6E 02
# and 6E 07. The LED messages are left to the keyboard.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6D 00 01 00 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 07 F7"
to = "setup_output"

# Knobs 1-8: CC 22-29, absolute, channel 1 [AB, inherited Knob_n = 22 + n].
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 24 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 25 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 26 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 27 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 28 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 29 }
slot = "control-1.8"

# < and >, which scroll track banks in DAW mode [UG p13]: Bank < 110 and
# Bank > 111 [AB, inherited]; they step the main selector. Transport: Loop
# 114, Stop 117, Play 118, Record 119 [UG p14 names them; AB, inherited].
[[inputs]]
id = "bank-left"
name = "<"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 110 }
slot = "step.down"

[[inputs]]
id = "bank-right"
name = ">"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 111 }
slot = "step.up"

[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 114 }

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

# RackForge's default meanings for eight knobs and no faders.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
