[package]
name = "rackforge-android-native"
description = "Android JNI bridge for the portable RackForge runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
jni = "0.21"
rackforge-core = { path = "../../../crates/rackforge-core" }
rackforge-control-api = { path = "../../../crates/rackforge-control-api" }
keylab-essential-mk3 = { package = "rackforge-controller-arturia-keylab-essential-mk3", path = "../../../hardware/keylab-bridge" }
rackforge-controller-package = { path = "../../../crates/rackforge-controller-package" }
rackforge-performance-api = { path = "../../../crates/rackforge-performance-api" }
rackforge-plugin-api = { path = "../../../crates/rackforge-plugin-api" }
rackforge-repository = { path = "../../../crates/rackforge-repository" }
rackforge-session-api = { path = "../../../crates/rackforge-session-api" }
rackforge-surface-runtime = { path = "../../../crates/rackforge-surface-runtime" }
serde_json.workspace = true
toml = "0.9"
semver.workspace = true
