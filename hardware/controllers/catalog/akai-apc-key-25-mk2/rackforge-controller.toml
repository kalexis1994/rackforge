# Stop All Clips 81, Play 91, Record 93, Shift 98: notes on channel 1 [CP;
# AB]. Shift is the modifier Ableton's script holds for the knobs' fine mode
# and the buttons' second functions [AB add_modifier_button]: here it is the
# Fn button, opening the Fn layer.
[[inputs]]
id = "stop-all-clips"
name = "Stop All Clips"
kind = "button"
group = "Transport"
midi = { channel = 0, note = 81 }
plays = false

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, note = 91 }
plays = false

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, note = 93 }
plays = false

[[inputs]]
id = "shift"
name = "Shift"
kind = "button"
group = "Buttons"
midi = { channel = 0, note = 98 }
modifier = true
plays = false

# Play takes the transport; Stop All Clips, the only stop it has, stops it.
# Their notes are the host's: no instrument plays them.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop-all-clips"
target = "transport_stop"
