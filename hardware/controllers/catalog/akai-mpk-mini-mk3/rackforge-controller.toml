# Akai Professional MPK mini mk3, on Program 1 ("PGM:MPC"), the program it
# starts on. Every value below is sourced in SOURCES.md; [QS] is the
# Quickstart Guide v1.3, [FAQ] Akai's MPK mini mk3 FAQ, [SX] Spectrasonics'
# Omnisphere setup for the MPK mini mk3, which relies on that program, [BW]
# Bitwig's MPK mini mk3 extension, [AB] Ableton Live 12's MPK_mini_mkIII
# script.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpk-mini-mk3"
name = "MPK mini mk3"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpk-mini-mk3"

# Its one MIDI port: "MPK mini 3" on Windows and a Mac, "MPK mini 3 MIDI 1"
# on Linux [BW port names; AB model_name "MPK mini 3"]. The sisters name
# themselves otherwise -- "MPK mini" (the first), "MPKmini2", "MPK mini
# Plus", "MPK mini IV", "MPK mini Play" -- and the words kept out are a
# guard, should a port name carry both. Akai documents no Identity Reply, so
# the name alone decides.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk mini 3"]
exclude_contains = ["play", "plus"]

# Knobs 1-8: CC 70-77 on channel 1 [SX "Knob 1 (CC#70)" to "Knob 8
# (CC#77)" in Program 1; BW binds its knobs to CC 70-77], read as absolute
# knobs (see SOURCES.md). They turn endlessly [QS "360° knobs"]. K1-K4 are
# the top row, K5-K8 the bottom one [BW control positions]. No faders: the
# knobs take the first row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 70 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 71 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 72 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 73 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 74 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 75 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 76 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 77 }
slot = "control-1.8"

# Pads, in note mode (the CC and Prog Change buttons off): notes on channel
# 10. Bank A sends 36-43 and bank B 44-51, pad by pad [AB PAD_TRANSLATION,
# notes 36-51 on channel 10; BW pads 36-43 on channel 10]. Pads 1-4 are the
# bottom row, 5-8 the top one [Akai, "How To Program MPK mini Pads in a
# DAW"]. A pad takes the slot of the note it sends, as on every keyboard in
# the catalog.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
