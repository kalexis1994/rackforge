# Novation Launch Control (the first, 2014), on factory template 1, which
# RackForge selects on connect. Every value below is sourced in SOURCES.md; [PR]
# is the Launch Control Programmer's Reference Guide, [GSG] its Getting Started
# Guide v2, [AB] Ableton Live 12's Launch_Control script.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launch-control"
name = "Launch Control"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launch-control"

# Its one MIDI port, "Launch Control", or "Launch Control n" for a unit set to
# device ID n [PR p2]. The Launch Control XL and XL 3 name themselves apart.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["launch control"]
exclude_contains = ["xl", "lcxl"]

# Where the template message goes: the same port.
[[devices.endpoints]]
role = "setup_output"
name_contains = ["launch control"]
exclude_contains = ["xl", "lcxl"]

# On connect, factory template 1 (F0 00 20 29 02 0A 77 08 F7): factory
# templates are 08h-0Fh and speak on MIDI channels 9-16 [PR p2, p7 "Change
# current template"]. Ableton selects the same template with the same message
# [AB Sysex.MIXER_MODE].
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 20 29 02 0A 77 08 F7"
to = "setup_output"

# The knobs, on template 1's channel, 9: the top row CC 21-28, the bottom row
# CC 41-48, absolute [AB make_all_encoders on channel 8 zero-based, absolute].
# No faders: the top row takes the first row, the bottom one the second. The
# Launch Control has no keys: none of its controls ever plays.

[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Top knobs"
midi = { channel = 8, cc = 21 }
slot = "control-1.1"
plays = false

