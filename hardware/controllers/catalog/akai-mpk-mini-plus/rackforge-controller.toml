# Akai Professional MPK mini Plus, on Program 1 ("MPC"), the first of its
# eight. Every value below is sourced in SOURCES.md; [PGM] is Akai's own
# factory file for it, "Preset1.mpkminiplus", shipped with the MPK mini Plus
# Program Editor 1.0.7; [UG] the MPK mini Plus User Guide v1.2; [AKA] and
# [AKF] Akai's own Ableton and FL Studio scripts for it; [BW] Bitwig's MPK
# mini Plus extension; [AB] Ableton Live 12's MPK_mini_Plus script.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-mpk-mini-plus"
name = "MPK mini Plus"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "mpk-mini-plus"

# Its first port: "MPK mini Plus" on Windows, "MPK mini Plus Port 1" on a Mac
# (Anschluss, Puerto, Porto in other languages), "MPK mini Plus MIDI 1" on
# Linux [BW port names]. The second port is the 5-pin MIDI interface [UG p7]
# and is not the keyboard's. The MPK mini Plus II names itself "MPK mini Plus
# II" [BW] and sends other messages.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["mpk mini plus"]
exclude_contains = [
    "plus ii",
    "midiin2",
    "midi 2",
    "port 2",
    "anschluss 2",
    "puerto 2",
    "porto 2",
]

# Knobs 1-8: CC 70-77, absolute, 0-127, on the keyboard's channel, 1 [PGM
# knob CC 70-77, Lo 0, Hi 127, mode 0; AKA Encoder1-8 70-77, channel 0,
# "Absolute"; AKF ID_KNOB_BASE = 70, KNOB_HW_MODE_ABS = 0]. They turn
# endlessly [UG item 20]. No faders: the knobs take the first row.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 70 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 71 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 72 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 73 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 74 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 75 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 76 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 77 }
slot = "control-1.8"

# Pads: notes on channel 10 [PGM pad channel 9, every pad in note mode].
# Bank A sends 36-43 and bank B 44-51, pad by pad [PGM; AKA Pad1-16Note
# 36-51 on channel 10]. Pads 1-4 are the bottom row, 5-8 the top one [Akai,
# "How To Program MPK mini Pads in a DAW"]. A pad takes the slot of the note
# it sends, as on every keyboard in the catalog.
[[inputs]]
id = "pad-1"
name = "Pad 1"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 36 }
slot = "switch-1.5"

[[inputs]]
id = "pad-2"
name = "Pad 2"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 37 }
slot = "switch-1.6"

[[inputs]]
id = "pad-3"
name = "Pad 3"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 38 }
slot = "switch-1.7"

[[inputs]]
id = "pad-4"
name = "Pad 4"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 39 }
slot = "switch-1.8"

[[inputs]]
id = "pad-5"
name = "Pad 5"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 40 }
slot = "switch-1.1"

[[inputs]]
id = "pad-6"
name = "Pad 6"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 41 }
slot = "switch-1.2"

[[inputs]]
id = "pad-7"
name = "Pad 7"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 42 }
slot = "switch-1.3"

[[inputs]]
id = "pad-8"
name = "Pad 8"
kind = "pad"
group = "Pads, bank A"
midi = { channel = 9, note = 43 }
slot = "switch-1.4"

[[inputs]]
id = "pad-9"
name = "Pad 9"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 44 }
slot = "switch-2.5"

[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 45 }
slot = "switch-2.6"

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 46 }
slot = "switch-2.7"

[[inputs]]
id = "pad-12"
name = "Pad 12"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 47 }
slot = "switch-2.8"

[[inputs]]
id = "pad-13"
name = "Pad 13"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 48 }
slot = "switch-2.1"

[[inputs]]
id = "pad-14"
name = "Pad 14"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 49 }
slot = "switch-2.2"

[[inputs]]
id = "pad-15"
name = "Pad 15"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 50 }
slot = "switch-2.3"

[[inputs]]
id = "pad-16"
name = "Pad 16"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 51 }
slot = "switch-2.4"

# The wheels, fixed [UG p12 "pre-configured and cannot be edited"], on the
# keyboard's channel: pitch bend, and modulation CC 1 [AKF ID_MOD = 1; BW
# keys input "b001??", "e0????"].
[[inputs]]
id = "pitch-bend"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }
slot = "mod-wheel"

# The joystick, in Dual CC mode on both axes, on the keyboard's channel:
# left and right both send CC 12, up and down both CC 2, from 0 at the
# centre [PGM X axis 2 with CC 12 and CC 12, Y axis 2 with CC 2 and CC 2;
# UG p22 "Dual CC"]. The reading of these fields is SOURCES.md's, with one
# program to check it against; no slot until the hardware confirms it.
[[inputs]]
id = "joystick-x"
name = "Joystick left / right"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, cc = 12 }

[[inputs]]
id = "joystick-y"
name = "Joystick up / down"
kind = "wheel"
group = "Joystick"
midi = { channel = 0, cc = 2 }

# Transport, CC on the keyboard's channel [UG items 21-25; AKA and AKF
# alike: << 115, >> 116, Stop 117, Play 118, Rec 119; BW the same, 127 on
# press and 0 on release]. << and >> step the main selector.
[[inputs]]
id = "rewind"
name = "<<"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 115 }
slot = "step.down"

[[inputs]]
id = "fast-forward"
name = ">>"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 116 }
slot = "step.up"

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Rec"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

# The sustain pedal input, CC 64 on the keyboard's channel [UG rear panel
# item 2; BW keys input "b040??"].
[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedals"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for eight knobs and no faders: tone on knobs
# 1-4, the amp envelope on knobs 5-8.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
