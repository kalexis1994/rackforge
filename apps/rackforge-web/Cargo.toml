[package]
name = "rackforge-web"
description = "Isolated HTTP and WebSocket gateway for the RackForge SPA"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom.workspace = true
mime_guess = "2.0"
rackforge-control-api = { path = "../../crates/rackforge-control-api" }
rackforge-plugin-api = { path = "../../crates/rackforge-plugin-api", features = ["package-validation"] }
rackforge-repository = { path = "../../crates/rackforge-repository" }
rackforge-resource-api = { path = "../../crates/rackforge-resource-api" }
rackforge-resource-host = { path = "../../crates/rackforge-resource-host" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http = { version = "0.6", features = ["fs", "trace"] }
