slot = "switch-2.5"

[[inputs]]
id = "pad-10"
name = "Pad 10"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 45 }
slot = "switch-2.6"

[[inputs]]
id = "pad-11"
name = "Pad 11"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 46 }
slot = "switch-2.7"

[[inputs]]
id = "pad-12"
name = "Pad 12"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 47 }
slot = "switch-2.8"

[[inputs]]
id = "pad-13"
name = "Pad 13"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 48 }
slot = "switch-2.1"

[[inputs]]
id = "pad-14"
name = "Pad 14"
kind = "pad"
group = "Pads, bank B"
midi = { channel = 9, note = 49 }
