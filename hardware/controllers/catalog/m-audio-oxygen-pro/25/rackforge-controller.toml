id = "pad-row-1"
name = "Pad row 1"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 107 }

[[inputs]]
id = "pad-row-2"
name = "Pad row 2"
kind = "button"
group = "Pads"
midi = { channel = 0, cc = 108 }

# Transport and navigation, channel 1 [AB elements.py; BW OxygenCcAssignments]:
# Loop 114, Rewind 115, Fast-forward 116, Stop 117, Play 118, Record 119;
# Bank < 110, Bank > 111; Metronome 106; Back 104. Rewind and fast-forward
# step the main selector, as the KeyLab's do; the bank buttons the second.
[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 114 }

[[inputs]]
id = "rewind"
name = "Rewind"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 115 }
slot = "step.down"

[[inputs]]
id = "fast-forward"
name = "Fast-forward"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 116 }
slot = "step.up"

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 117 }

[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 118 }

[[inputs]]
id = "record"
name = "Record"
kind = "button"
group = "Transport"
midi = { channel = 0, cc = 119 }

[[inputs]]
id = "bank-left"
name = "Bank <"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 110 }
slot = "step-2.down"

[[inputs]]
id = "bank-right"
name = "Bank >"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 111 }
slot = "step-2.up"

[[inputs]]
id = "metronome"
name = "Metronome"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 106 }
slot = "switch-3.3"

[[inputs]]
id = "back"
name = "Back"
kind = "button"
group = "Buttons"
midi = { channel = 0, cc = 104 }

# RackForge's default meanings for eight knobs and no faders; the master
# fader keeps the master level.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "knob-4"
role = "synth.lfo.rate"

[[roles]]
input = "knob-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "knob-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "knob-8"
role = "synth.envelope.amp.release"

[[roles]]
input = "master-fader"
role = "rackforge.master.level"

# Play and Stop take the transport.
[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
