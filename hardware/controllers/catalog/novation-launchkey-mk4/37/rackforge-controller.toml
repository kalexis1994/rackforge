midi = { channel = 15, cc = 117 }

[[inputs]]
id = "loop"
name = "Loop"
kind = "button"
group = "Transport"
midi = { channel = 15, cc = 118 }

# Play and Stop send MIDI Real Time Start and Stop [PR p7].
[[inputs]]
id = "play"
name = "Play"
kind = "button"
group = "Transport"
midi = { realtime = "start" }

[[inputs]]
id = "stop"
name = "Stop"
kind = "button"
group = "Transport"
midi = { realtime = "stop" }

# Wheels on the keys channel; the modulation wheel sends CC 1 and the sustain
# input CC 64 by default [UG p9; CG "Mod Wheel/Strip" and "Pedal"].
[[inputs]]
id = "pitch-bend"
name = "Pitch wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, pitch_bend = true }

[[inputs]]
id = "modulation"
name = "Modulation wheel"
kind = "wheel"
group = "Wheels"
midi = { channel = 0, cc = 1 }

[[inputs]]
id = "sustain"
name = "Sustain pedal"
kind = "pedal"
group = "Pedal"
midi = { channel = 0, cc = 64 }

# RackForge's default meanings for a keyboard with eight knobs and no
# faders: the filter, its envelope and the LFO rate, then the amp envelope.
[[roles]]
input = "encoder-1"
role = "synth.filter.cutoff"

[[roles]]
input = "encoder-2"
role = "synth.filter.resonance"

[[roles]]
input = "encoder-3"
role = "synth.filter.envelope.amount"

[[roles]]
input = "encoder-4"
role = "synth.lfo.rate"

[[roles]]
input = "encoder-5"
role = "synth.envelope.amp.attack"

[[roles]]
input = "encoder-6"
role = "synth.envelope.amp.decay"

[[roles]]
input = "encoder-7"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "encoder-8"
role = "synth.envelope.amp.release"

[[actions]]
input = "play"
target = "transport_play"

[[actions]]
input = "stop"
target = "transport_stop"
