# M-Audio Oxygen Pro 25, in the DAW mode RackForge puts it in on
# connect. Every value below is sourced in ../SOURCES.md; [UG] is the Oxygen
# Pro Series User Guide v1.1, [AB] Ableton Live 12's Oxygen Pro remote script,
# [BW] Bitwig's Oxygen Pro extension. [AB] and [BW] are official software:
# both put the keyboard in this mode with the same messages and read the same
# controls, value for value.
schema_version = 2
kind = "controller"
id = "org.rackforge.m-audio-oxygen-pro-25"
name = "Oxygen Pro 25"
vendor = "M-Audio"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "oxygen-pro-25"

# The controls speak on the third port pair: "MIDIIN3 (Oxygen Pro 25)" /
# "MIDIOUT3 (Oxygen Pro 25)" on Windows, "Oxygen Pro 25 Mackie/HUI" on a
# Mac and on Linux [UG p110; BW port names]. The keys, wheels and pedal stay
# on the first port ("Oxygen Pro 25", "... USB MIDI") and play as any
# keyboard does. The size is in every name: the 25, 49 and 61 never meet, and
# neither do the Oxygen Pro Mini or the Oxygen MKV ("Oxygen 25 MKV").
[[devices.endpoints]]
role = "performance_input"
name_contains = ["oxygen pro 25"]
name_contains_any = ["midiin3", "mackie"]

# Where the mode messages go: the same third port, as an output.
[[devices.endpoints]]
role = "setup_output"
name_contains = ["oxygen pro 25"]
name_contains_any = ["midiout3", "mackie"]

# On connect, RackForge sends what Ableton and Bitwig send when they take the
# keyboard [AB midi.py, oxygen_pro.py on_identified; BW MidiProcessor]:
# F0 00 01 05 7F 00 00 <command> 00 01 <value> F7, M-Audio's ID 00 01 05.
# Command 6D value 02 is the Live firmware mode; 6E 02 then 6E 07 the record
# and device control modes. Both also send 6B 01 and 6C 03, which hand the
# LEDs to the host: RackForge does not drive them, so it leaves them to the
# keyboard.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6D 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 07 F7"
to = "setup_output"

# Knobs 1-8: CC 22-29, absolute, channel 1 [AB elements.py create_encoder;
# BW KNOB_1 = 0x16]. The only row: the first.
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-1.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-1.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 24 }
slot = "control-1.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 25 }
slot = "control-1.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 26 }
slot = "control-1.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 27 }
slot = "control-1.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 28 }
slot = "control-1.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 29 }
slot = "control-1.8"

# The master fader: CC 41 [AB Master_Fader; BW MASTER_CC = 0x29]. The 25's only fader.
[[inputs]]
id = "master-fader"
name = "Master fader"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 41 }

# Pads: notes on channel 1, top row 40-43 48-51, bottom row 36-39 44-47 [AB
