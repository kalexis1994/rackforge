# Novation FLkey 2 49, standalone use outside FL Studio, with its power-on modes
# and default Custom Modes. Every value below is sourced in ../SOURCES.md; [UG]
# is the FLkey 2 49 user guide, [CG] Novation's FLkey 2 Components guide.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-flkey-2-49"
name = "FLkey 2 49"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "flkey-2-49"

# The MIDI interface only, "FLkey MK2 49 MIDI Out" in Novation's screenshot; the
# DAW interface is "... DAW Out", named MIDIIN2 on Windows [UG p13]. The first
# FLkey generation has no "MK2" in its names and never matches.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["flkey mk2 49"]
exclude_contains = ["daw", "midiin2", "port 2", "midi 2 "]

# Encoders, Custom encoder mode 1, the power-on encoder mode: CC 21-28 on page 1
# and CC 29-36 on page 2 (Encoder bank buttons), absolute 0-127, on the global
# (keys) channel, channel 1 by default [CG encoders screenshot; UG settings,
# Power On Modes].
[[inputs]]
id = "encoder-1"
name = "Encoder 1"
kind = "encoder"
encoder = "absolute"
group = "Encoders"
midi = { channel = 0, cc = 21 }
slot = "control-2.1"

[[inputs]]
id = "encoder-2"
name = "Encoder 2"
kind = "encoder"
encoder = "absolute"
group = "Encoders"
midi = { channel = 0, cc = 22 }
slot = "control-2.2"

