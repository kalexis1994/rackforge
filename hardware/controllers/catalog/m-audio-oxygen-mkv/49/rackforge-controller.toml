# M-Audio Oxygen 49 (MKV, fifth generation), in the DAW mode RackForge
# puts it in on connect. Every value below is sourced in ../SOURCES.md; [UG]
# is the Oxygen Series MKV User Guide v1.2, [AB] Ableton Live 12's
# Oxygen_5th_Gen remote script: the Oxygen Pro script with its own mode byte.
# [AB] is the only source for the controls' messages: see SOURCES.md.
schema_version = 2
kind = "controller"
id = "org.rackforge.m-audio-oxygen-mkv-49"
name = "Oxygen 49 [MKV]"
vendor = "M-Audio"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "oxygen-49-mkv"

# The controls speak on the second port pair, the one [AB] reads and writes:
# "MIDIIN2 (Oxygen 49 MKV)" / "MIDIOUT2 (...)" on Windows [M-Audio's Pro
# Tools and FL Studio setup articles]; on a Mac M-Audio names it both "Oxygen
# 49 DAW" and "Oxygen 49 MKV Mackie/HUI". The keys, wheels and pedal
# stay on the first port. "oxygen 49" is never in an Oxygen Pro's names
# ("Oxygen Pro 49").
[[devices.endpoints]]
role = "performance_input"
name_contains = ["oxygen 49"]
name_contains_any = ["midiin2", "mackie", "daw"]

[[devices.endpoints]]
role = "setup_output"
name_contains = ["oxygen 49"]
name_contains_any = ["midiout2", "mackie", "daw"]

# On connect, what [AB] sends it: the Oxygen Pro's messages with the MKV's
# firmware mode byte, 6D 00 (Oxygen_5th_Gen.LIVE_MODE_BYTE = 0), then 6E 02
# and 6E 07. The LED messages are left to the keyboard.
[permissions]
midi_input = true
midi_output = true
sysex = true

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6D 00 01 00 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 02 F7"
to = "setup_output"

[[on_connect]]
message = "F0 00 01 05 7F 00 00 6E 00 01 07 F7"
to = "setup_output"

# Knobs 1-8: CC 22-29, absolute, channel 1 [AB, inherited Knob_n = 22 + n].
[[inputs]]
id = "knob-1"
name = "Knob 1"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 22 }
slot = "control-2.1"

[[inputs]]
id = "knob-2"
name = "Knob 2"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 23 }
slot = "control-2.2"

[[inputs]]
id = "knob-3"
name = "Knob 3"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 24 }
slot = "control-2.3"

[[inputs]]
id = "knob-4"
name = "Knob 4"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 25 }
slot = "control-2.4"

[[inputs]]
id = "knob-5"
name = "Knob 5"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 26 }
slot = "control-2.5"

[[inputs]]
id = "knob-6"
name = "Knob 6"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 27 }
slot = "control-2.6"

[[inputs]]
id = "knob-7"
name = "Knob 7"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 28 }
slot = "control-2.7"

[[inputs]]
id = "knob-8"
name = "Knob 8"
kind = "knob"
group = "Knobs"
midi = { channel = 0, cc = 29 }
slot = "control-2.8"

# Faders 1-8: CC 12-19; fader 9, the master: CC 41; channel 1 [AB, inherited
