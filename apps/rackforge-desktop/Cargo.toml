[package]
name = "rackforge-desktop"
description = "RackForge desktop host with the embedded Web workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
include_dir = "0.7"
mime_guess = "2.0"
rackforge-control-api = { path = "../../crates/rackforge-control-api" }
keylab-essential-mk3 = { package = "rackforge-controller-arturia-keylab-essential-mk3", path = "../../hardware/keylab-bridge" }
rackforge-core = { path = "../../crates/rackforge-core" }
rackforge-performance-api = { path = "../../crates/rackforge-performance-api" }
rackforge-plugin-api = { path = "../../crates/rackforge-plugin-api" }
rackforge-repository = { path = "../../crates/rackforge-repository" }
rackforge-resource-api = { path = "../../crates/rackforge-resource-api" }
rackforge-resource-host = { path = "../../crates/rackforge-resource-host" }
rackforge-session-api = { path = "../../crates/rackforge-session-api" }
rackforge-surface-api = { path = "../../crates/rackforge-surface-api" }
rackforge-surface-runtime = { path = "../../crates/rackforge-surface-runtime" }
serde_json.workspace = true
serde.workspace = true
semver.workspace = true
tokio.workspace = true
toml.workspace = true
webbrowser = "1.0"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16.0", features = ["asio"] }
midir = "0.11"
rfd = "0.17.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.56.0", default-features = false, features = ["os-webview"] }
