name: Build main artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.0

jobs:
  quality:
    name: Tests and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Install native test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

          rustup component add rustfmt clippy

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --dir web install --frozen-lockfile

      - name: Test Web contracts
        shell: bash
        run: pnpm --dir web test

      - name: Lint Web workspace
        shell: bash
        run: pnpm --dir web lint --max-warnings=0

      - name: Build Web workspace
        shell: bash
        run: pnpm --dir web build

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        shell: bash
        # Desktop owns Windows-only WebView2, audio-device and controller-surface
        # integrations. Lint the portable workspace here and enforce Desktop in
        # the Windows job below so every crate is checked on its real platform.
        run: cargo clippy --locked --workspace --exclude rackforge-desktop --all-targets --all-features -- -D warnings

      - name: Test shared runtime contracts
        shell: bash
        run: |
          cargo test --locked \
            -p rackforge-audio-api \
            -p rackforge-control-profile \
            -p rackforge-control-api \
            -p rackforge-controller-api \
            -p rackforge-controller-package \
            -p rackforge-dsp \
            -p rackforge-host-capabilities \
            -p rackforge-midi-api \
            -p rackforge-platform-api \
            -p rackforge-plugin-api \
            -p rackforge-plugin-runtime \
            -p rackforge-program-api \
            -p rackforge-resource-api \
            -p rackforge-session-api \
            -p rackforge-surface-api \
            -p rackforge-performance-api \
            -p rackforge-repository \
            -p rackforge-resource-host \
            -p rackforge-surface-runtime \
            -p rackforge-ui \
            -p rackforge-core \
            -p rackforge-browser \
            -p rackforge-concert-grand \
            -p rackforge-demo-synth \
            -p rackforge-gain \
            -p rackforge-gain-portable

      # Keep the native driver harness in its own Cargo graph. On Windows GNU,
      # feature unification with the full plugin-validation graph can produce
      # an invalid test executable before the harness starts; the driver itself
      # has no dependency on that graph.
      - name: Test bundled controller driver
        shell: bash
        run: cargo test --locked -p rackforge-controller-arturia-keylab-essential-mk3

  windows:
    name: Windows x86-64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup component add clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web workspace
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Lint Windows Rust applications
        shell: pwsh
        run: cargo clippy --locked -p rackforge-desktop -p rackforge-vst3 --all-targets --all-features -- -D warnings

      # The bundled instrument is developed in this repository, so it is
      # packaged from the same commit that builds the host: no fetch, no
      # version skew, no checksum ceremony for code the tree already controls.
      - name: Package the bundled Concert Grand
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p rackforge-concert-grand
          New-Item -ItemType Directory -Force dist/bundled-plugins | Out-Null
          cargo run --release -p rackforge-store -- pack-wasm `
            plugins/concert-grand/package `
            target/wasm32-unknown-unknown/release/rackforge_concert_grand.wasm `
            dist/bundled-plugins/RackForge-Concert-Grand.rfplugin
          $plugin = Join-Path $PWD 'dist/bundled-plugins/RackForge-Concert-Grand.rfplugin'
          "RACKFORGE_BUNDLED_PLUGIN=$plugin" >> $env:GITHUB_ENV

      - name: Build RackForge Desktop
        shell: pwsh
        run: ./tools/build-windows-desktop.ps1 -RunTests

      - name: Build RackForge VST3
        shell: pwsh
        run: ./tools/build-windows-vst3.ps1 -RunTests

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-Windows-x86_64-${{ github.sha }}
          path: dist/windows-x86_64/rackforge.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-VST3-Windows-x86_64-${{ github.sha }}
          path: |
            dist/windows-x86_64/rackforge-vst3.dll
            dist/windows-x86_64/RackForge.vst3
            dist/windows-x86_64/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14

  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Package the bundled Concert Grand
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p rackforge-concert-grand
          mkdir -p dist/bundled-plugins
          cargo run --release -p rackforge-store -- pack-wasm \
            plugins/concert-grand/package \
            target/wasm32-unknown-unknown/release/rackforge_concert_grand.wasm \
            dist/bundled-plugins/RackForge-Concert-Grand.rfplugin
          printf 'RACKFORGE_BUNDLED_PLUGIN=%s/dist/bundled-plugins/RackForge-Concert-Grand.rfplugin\n' \
            "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Build Linux x86-64 release bundle
        shell: bash
        run: bash tools/build-linux-x86_64.sh

      - name: Upload Linux x86-64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-Linux-x86_64-${{ github.sha }}
          path: dist/linux-x86_64/RackForge-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/rackforge-android/**/*.gradle.kts
            apps/rackforge-android/gradle/wrapper/gradle-wrapper.properties

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            printf 'ANDROID_SDK_ROOT and ANDROID_HOME are both unset\n' >&2
            exit 1
          fi
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" && -d "$sdk_root/cmdline-tools" ]]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          fi
          if [[ -z "$sdkmanager_path" || ! -x "$sdkmanager_path" ]]; then
            printf 'sdkmanager was not found below %s\n' "$sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_path" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          test -x "$sdk_root/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      # The bundled instrument is developed in this repository, so it is
      # packaged from the same commit that builds the host: no fetch, no
      # version skew, no checksum ceremony for code the tree already controls.
      - name: Package the bundled Concert Grand
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p rackforge-concert-grand
          New-Item -ItemType Directory -Force dist/bundled-plugins | Out-Null
          cargo run --release -p rackforge-store -- pack-wasm `
            plugins/concert-grand/package `
            target/wasm32-unknown-unknown/release/rackforge_concert_grand.wasm `
            dist/bundled-plugins/RackForge-Concert-Grand.rfplugin
          $plugin = Join-Path $PWD 'dist/bundled-plugins/RackForge-Concert-Grand.rfplugin'
          "RACKFORGE_BUNDLED_PLUGIN=$plugin" >> $env:GITHUB_ENV

      - name: Build Android APK
        shell: bash
        run: bash tools/build-android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-Android-arm64-${{ github.sha }}
          path: dist/android/RackForge-debug.apk
          if-no-files-found: error
          retention-days: 14

  raspberry-pi:
    name: Raspberry Pi ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out RackForge
        uses: actions/checkout@v6

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Check Raspberry Pi Rust targets
        shell: bash
        run: |
          cargo check --locked --all-targets \
            -p rackforge-core \
            -p rackforge-controller-arturia-keylab-essential-mk3
          cargo test --locked \
            -p rackforge-core \
            -p rackforge-controller-arturia-keylab-essential-mk3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      # The bundled instrument is developed in this repository, so it is
      # packaged from the same commit that builds the host: no fetch, no
      # version skew, no checksum ceremony for code the tree already controls.
      - name: Package the bundled Concert Grand
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p rackforge-concert-grand
          New-Item -ItemType Directory -Force dist/bundled-plugins | Out-Null
          cargo run --release -p rackforge-store -- pack-wasm `
            plugins/concert-grand/package `
            target/wasm32-unknown-unknown/release/rackforge_concert_grand.wasm `
            dist/bundled-plugins/RackForge-Concert-Grand.rfplugin
          $plugin = Join-Path $PWD 'dist/bundled-plugins/RackForge-Concert-Grand.rfplugin'
          "RACKFORGE_BUNDLED_PLUGIN=$plugin" >> $env:GITHUB_ENV

      - name: Build Raspberry Pi release bundle
        shell: bash
        run: bash tools/build-raspberry-pi.sh

      - name: Upload Raspberry Pi bundle
        uses: actions/upload-artifact@v4
        with:
          name: RackForge-RaspberryPi-arm64-${{ github.sha }}
          path: dist/raspberry-pi/RackForge-RaspberryPi-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
