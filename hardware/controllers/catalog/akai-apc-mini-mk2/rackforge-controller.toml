# Akai Professional APC mini mk2, its control port, with the grid in
# Session mode. Every value below is sourced in SOURCES.md; [CP] is Akai's APC
# mini mk2 Communication Protocol v1.0, [UG] its User Guide v1.7, [AB] Ableton
# Live 12's APC_mini_mk2 script, [BW] Bitwig's APC mini mk2 extension. [CP] is
# the maker's own table of every message.
schema_version = 2
kind = "controller"
id = "org.rackforge.akai-apc-mini-mk2"
name = "APC mini mk2"
vendor = "Akai Professional"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "apc-mini-mk2"

# The faders, grid and buttons speak on port 0 [CP]: "APC mini mk2 Control"
# on a Mac and Linux, "APC mini mk2" on Windows [BW port names]. The other
# port, "... Notes" or "MIDIIN2 (APC mini mk2)", carries Note mode [CP; BW].
# "mk2" keeps the first APC mini out, which sends other messages.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["apc mini mk2 control"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["apc mini mk2"]
exclude_contains = ["control", "notes", "midiin"]

# The APC mini mk2's control port has no keys: none of its controls ever
# plays. Its grid and buttons send notes, its faders CC 48-56.

# Faders 1-8: CC 48-55; the master fader, 9: CC 56; channel 1, "the absolute
# position of the Fader" [CP; AB Faders, Master_Fader]. Faders 1-8 take the
# first row; the master keeps RackForge's master level.
[[inputs]]
id = "fader-1"
name = "Fader 1"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 48 }
slot = "control-1.1"
plays = false

[[inputs]]
id = "fader-2"
name = "Fader 2"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 49 }
slot = "control-1.2"
plays = false

[[inputs]]
id = "fader-3"
name = "Fader 3"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 50 }
slot = "control-1.3"
plays = false

[[inputs]]
id = "fader-4"
name = "Fader 4"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 51 }
slot = "control-1.4"
plays = false

[[inputs]]
id = "fader-5"
name = "Fader 5"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 52 }
slot = "control-1.5"
plays = false

[[inputs]]
id = "fader-6"
name = "Fader 6"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 53 }
slot = "control-1.6"
plays = false

[[inputs]]
id = "fader-7"
name = "Fader 7"
kind = "fader"
group = "Faders"
midi = { channel = 0, cc = 54 }
slot = "control-1.7"
plays = false

[[inputs]]
