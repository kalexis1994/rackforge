# The pads, on template 1: notes 9-12 and 25-28 on channel 9, velocity 127 on
# press and a release [AB pad_identifiers, is_pad=True, channel 8 zero-based;
# PR p7]. They take the first switch row, in order. Such low notes are no
# instrument's: they never play.

[[inputs]]
