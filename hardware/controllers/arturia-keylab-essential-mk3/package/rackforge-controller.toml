schema_version = 1
kind = "controller"
id = "org.rackforge.arturia-keylab-essential-mk3"
name = "Arturia KeyLab Essential 61 mk3"
version = "0.2.37"
controller_api = "^1.0"

[runtime]
kind = "process-v1"

[runtime.entrypoints]
linux-aarch64 = "bin/linux-aarch64/rackforge-arturia-keylab-essential-mk3-driver"
linux-x86-64 = "bin/linux-x86-64/rackforge-arturia-keylab-essential-mk3-driver"
windows-x86-64 = "bin/windows-x86-64/rackforge-arturia-keylab-essential-mk3-driver.exe"

[permissions]
midi_input = true
midi_output = true
sysex = true
usb_metadata = true
raw_usb = false
firmware_write = false
filesystem = false
network = false

[[host_actions]]
target = "keyboard_parts"

[host_actions.midi_cc]
channel = 0
controller = 119
press_value = 127
release_value = 0

# RackForge Control Profile v1. The first eight DAW-preset encoders and faders
# are transport-independent controls. Encoder 9 and fader 9 use the same
# semantic vocabulary for RackForge's global pan and level; they are not
# private controller shortcuts. Plugins opt in by publishing matching roles.
[semantic_profile]
schema_version = 1
source_id = "controller.arturia.keylab-essential-mk3.midi"

[[semantic_profile.controls]]
role = "synth.oscillator.pulse_width"
[semantic_profile.controls.midi_cc]
channel = 0
controller = 96

[[semantic_profile.controls]]
role = "synth.oscillator.sub.level"
[semantic_profile.controls.midi_cc]
channel = 0
controller = 97

