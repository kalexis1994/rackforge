schema_version = 2
kind = "controller"
id = "org.example.my-midi-controller"
name = "My MIDI Controller"
vendor = "Example"
version = "1.0.0"
controller_api = "^1.0"

# Identity: how RackForge recognises the device. With no [runtime] and no
# [permissions], the package is data only and asks for MIDI input alone.
[[devices]]
id = "my-midi-controller.v1"

[[devices.endpoints]]
role = "performance_input"
name_contains = ["my midi controller"]
exclude_contains = ["daw", "mcu", "hui", "dinthru"]

# Inputs: every physical control, with the message it sends. A player's own
# mappings refer to these ids, so they stay the same across versions.
[[inputs]]
id = "knob-1"
name = "Cutoff"
kind = "knob"
group = "Knobs"
midi = { cc = 74, channel = 0 }

[[inputs]]
id = "knob-2"
name = "Resonance"
kind = "knob"
group = "Knobs"
midi = { cc = 71, channel = 0 }

[[inputs]]
id = "knob-3"
name = "Attack"
kind = "knob"
group = "Knobs"
midi = { cc = 73, channel = 0 }

[[inputs]]
id = "knob-4"
name = "Release"
kind = "knob"
group = "Knobs"
midi = { cc = 72, channel = 0 }

[[inputs]]
id = "fader-master"
name = "Master"
kind = "fader"
group = "Master"
midi = { cc = 7, channel = 0 }

[[inputs]]
id = "knob-pan"
name = "Pan"
kind = "knob"
group = "Master"
midi = { cc = 10, channel = 0 }

[[inputs]]
id = "button-parts"
name = "Parts"
kind = "button"
group = "Buttons"
midi = { cc = 119, channel = 0 }
button = { press = 127, release = 0 }

# Meanings: the standard assignment of each input, until a player maps it
# themselves. Plugins that publish a role receive it.
[[roles]]
input = "knob-1"
role = "synth.filter.cutoff"

[[roles]]
input = "knob-2"
role = "synth.filter.resonance"

[[roles]]
input = "knob-3"
role = "synth.envelope.amp.attack"

[[roles]]
input = "knob-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-master"
role = "rackforge.master.level"

[[roles]]
input = "knob-pan"
role = "rackforge.master.pan"

[[actions]]
input = "button-parts"
target = "keyboard_parts"
