# RackForge Control Profile v1. The first eight knobs and faders are
# transport-independent controls. Knob 9 and fader 9 use the same semantic
# vocabulary for RackForge's global pan and level; they are not private
# controller shortcuts. Plugins opt in by publishing matching roles.
[[roles]]
input = "encoder-1"
role = "synth.oscillator.pulse_width"

[[roles]]
input = "encoder-2"
role = "synth.oscillator.sub.level"

[[roles]]
input = "encoder-3"
role = "synth.oscillator.noise.level"

[[roles]]
input = "encoder-4"
role = "synth.filter.envelope.amount"

[[roles]]
input = "encoder-5"
role = "synth.filter.lfo.amount"

[[roles]]
input = "encoder-6"
role = "synth.filter.key_tracking"

[[roles]]
input = "encoder-7"
role = "synth.lfo.delay"

[[roles]]
input = "encoder-8"
role = "synth.amplifier.level"

# Moves the pan by how far the knob turned, from where the pan already is:
# the first reading only anchors it, so the mix never jumps to the knob.
[[roles]]
input = "encoder-9"
role = "rackforge.master.pan"
mode = "relative"

[[roles]]
input = "fader-1"
role = "synth.envelope.amp.attack"

[[roles]]
input = "fader-2"
role = "synth.envelope.amp.decay"

[[roles]]
input = "fader-3"
role = "synth.envelope.amp.sustain"

[[roles]]
input = "fader-4"
role = "synth.envelope.amp.release"

[[roles]]
input = "fader-5"
role = "synth.filter.cutoff"

[[roles]]
input = "fader-6"
role = "synth.filter.resonance"

[[roles]]
input = "fader-7"
role = "synth.lfo.rate"

[[roles]]
input = "fader-8"
role = "synth.lfo.depth"

[[roles]]
input = "fader-9"
role = "rackforge.master.level"

[[actions]]
input = "part"
target = "keyboard_parts"

# The 49, 61 and 88 "sport exactly the same buttons, knobs, faders and
# connectivity" (Arturia's KeyLab Essential mk3 User Manual 1.1.6, p7), and
# the same display, so one driver drives the three. Their USB product ids are
# Ableton's (KeyLab_Essential_mk3 `get_capabilities`: 588, 652, 716). The 61's
# product name was read from a running Android host; the 49's and 88's
# follow it.
[[devices]]
id = "arturia.keylab-essential-mk3"
usb_vendor_id = 0x1c75
usb_product_ids = [0x024c, 0x028c, 0x02cc]
product_names = ["KeyLab Essential 49 mk3", "KeyLab Essential 61 mk3", "KeyLab Essential 88 mk3"]

[[devices.endpoints]]
role = "surface_input"
name_contains = ["mk3"]
name_contains_any = ["keylab essential", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[devices.endpoints]]
role = "display_output"
name_contains = ["mk3"]
name_contains_any = ["keylab essential", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[devices.endpoints]]
role = "performance_input"
name_contains = ["mk3"]
name_contains_any = ["keylab essential", "kl essential"]
name_ends_with = "midi"
exclude_contains = ["mcu", "hui", "dinthru", "alv"]

[[surfaces]]
layout_id = "little@1"
quality = "native"
priority = 0

[surfaces.viewport]
text_columns = 18
header_rows = 1
body_rows = 2
soft_keys = 4

[surfaces.gestures]
soft_key_long_press = true
emergency_home_chord = true

[[settings]]
id = "key-light-color"
name = "Key light color"
kind = "color"
default = "#145080"

# Bank and the eight pads while the pads are on bank B. By default an amber
# as bright as the key light's default blue -- its channels in another
# order -- so bank B reads by colour, not by brightness. The 49, 61 and 88
# share the panel, so it applies to all three.
[[settings]]
id = "bank-b-light-color"
name = "Bank B light color"
kind = "color"
default = "#805014"
