# Novation Launch Control 3, Mode 8: the default set of Control Changes that
# cannot be edited. Every value below is sourced in SOURCES.md; [UG] is the
# Launch Control 3 User Guide v1.1, [PR] its online programmer's reference
# guide, [BW] Bitwig's Launch Control 3 extension definition.
schema_version = 2
kind = "controller"
id = "org.rackforge.novation-launch-control-3"
name = "Launch Control 3"
vendor = "Novation"
version = "1.0.0"
controller_api = "^1.0"

[[devices]]
id = "launch-control-3"

# The MIDI interface, where a Custom Mode's controls speak [PR "MIDI on Launch
# Control 3"]: "LC3 1 MIDI" on Windows, the number being the device ID. Its DAW
# interface is "MIDIIN2 (LC3 1 MIDI)" on Windows, "LC3 1 DAW Out" on a Mac,
# "LC3 1 LC3 1 DAW Out" on Linux [BW]; the third and fourth feed the DIN outputs
# [PR]. The Launch Control XL 3 is "LCXL3" and never matches.
[[devices.endpoints]]
role = "performance_input"
name_contains = ["lc3"]
exclude_contains = ["daw", "midiin", "port 2", "midi 2 ", "din"]

# Its DAW port, where it takes the messages that change its mode:
# "MIDIOUT2 (LC3 1 MIDI)" on Windows, "LC3 1 DAW In" on a Mac, "LC3 1 LC3 1
# DAW In" on Linux [BW; PR "feature Controls"].
[[devices.endpoints]]
role = "setup_output"
name_contains = ["lc3"]
name_contains_any = ["midiout2", "daw in", "port 2"]

# On connect, RackForge selects Mode 8, the mode described below: feature
# controls on (9Fh 0Bh 7Fh), then surface mode select, Control Change 1Eh on
# channel 7, value 15h: Custom Modes 5-16 are 12h-1Dh [PR "feature
# Controls"]. Both go to the DAW port. The Launch Control 3 powers up in
# standalone mode, on a Custom Mode [PR "standalone (MIDI) mode"; UG p22].
[permissions]
midi_input = true
midi_output = true

[[on_connect]]
message = "9F 0B 7F"
to = "setup_output"

[[on_connect]]
message = "B6 1E 15"
to = "setup_output"

# Encoders, Mode 8: row 1 CC 13-20, row 2 CC 21-28, on channel 16 [UG p66,
# "Default Mode (8) parameters"]. No faders: row 1 takes the first row, row 2
# the second. The Launch Control 3 has no keys, and its controls' numbers are
# an instrument's controllers: none of them ever plays.

[[inputs]]
id = "encoder-1-1"
name = "Row 1 encoder 1"
kind = "encoder"
encoder = "absolute"
group = "Encoders, row 1"
midi = { channel = 15, cc = 13 }
slot = "control-1.1"
plays = false

