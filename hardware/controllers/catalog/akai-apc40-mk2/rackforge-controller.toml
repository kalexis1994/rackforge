group = "Faders"
midi = { channel = 3, cc = 7 }
slot = "control-1.4"

[[inputs]]
id = "fader-5"
name = "Track 5 fader"
kind = "fader"
group = "Faders"
midi = { channel = 4, cc = 7 }
slot = "control-1.5"

[[inputs]]
id = "fader-6"
name = "Track 6 fader"
kind = "fader"
group = "Faders"
midi = { channel = 5, cc = 7 }
slot = "control-1.6"

[[inputs]]
id = "fader-7"
name = "Track 7 fader"
